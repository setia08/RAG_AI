const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function load(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function store(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

MODULES.forEach(m => m.topics.forEach((t,i) => t.id = m.id + "-" + i));
const ALL = MODULES.flatMap(m => m.topics.map(t => ({m, t})));
let learned = new Set(load("prep-learned", []));
let currentMod = load("prep-mod", MODULES[0].id);
if(!MODULES.find(m=>m.id===currentMod)) currentMod = MODULES[0].id;

/* theme */
(function(){
  const t = load("prep-theme", null);
  if(t) document.documentElement.setAttribute("data-theme", t);
  $("#themeBtn").onclick = () => {
    const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next); store("prep-theme", next);
  };
})();

function updateProgress(){
  const n = ALL.filter(x => learned.has(x.t.id)).length;
  $("#progtxt").textContent = n + " of " + ALL.length + " topics learned";
  $("#progbar").style.width = (100*n/ALL.length) + "%";
  renderNav();
}

function renderNav(){
  let lt = null;
  $("#side").innerHTML = MODULES.map(m => {
    const done = m.topics.filter(t => learned.has(t.id)).length;
    let head = "";
    if(m.track !== lt){ lt = m.track; head = `<div class="trackh">${esc(TRACKS[m.track])}</div>`; }
    return head + `<button class="${m.id===currentMod?'on':''}" data-mod="${m.id}"><span>${m.step?`<em>${m.step}.</em> `:''}${esc(m.name)}</span><small>${done}/${m.topics.length}</small></button>`;
  }).join("");
  $("#modsel").innerHTML = Object.keys(TRACKS).map(g => `<optgroup label="${esc(TRACKS[g])}">${MODULES.filter(m=>m.track===g).map(m => {
    const done = m.topics.filter(t => learned.has(t.id)).length;
    return `<option value="${m.id}" ${m.id===currentMod?'selected':''}>${m.step?m.step+'. ':''}${esc(m.name)} (${done}/${m.topics.length})</option>`;
  }).join("")}</optgroup>`).join("");
}
$("#side").addEventListener("click", e => { const b = e.target.closest("button[data-mod]"); if(b) openModule(b.dataset.mod); });
$("#modsel").addEventListener("change", e => openModule(e.target.value));

function openModule(id, topicId){
  currentMod = id; store("prep-mod", id);
  const m = MODULES.find(x => x.id === id);
  const idx = MODULES.indexOf(m);
  const next = MODULES[idx+1];
  $("#module").innerHTML = `<div class="modhead"><span class="pill lv-${m.level.toLowerCase().replace(/ /g,"-")}">${esc(m.level)}${m.step?` · Step ${m.step} of ${SYLLABUS.length}`:""}</span><h2>${esc(m.name)}</h2><p>${esc(m.blurb)}</p></div>
  <div class="modtools"><button class="btn" data-act="expand">Expand all</button><button class="btn" data-act="collapse">Collapse all</button><button class="btn" data-act="markall">Mark module learned</button></div>
  ${m.topics.map(t => `<details class="topic" id="${t.id}"><summary><span class="tt">${esc(t.t)}</span><span class="check ${learned.has(t.id)?'done':''}" aria-hidden="true"></span></summary><div class="body">${t.b}${t.tip?`<p class="tip"><b>Interview tip:</b> ${t.tip}</p>`:''}<label class="learnbox"><input type="checkbox" data-learn="${t.id}" ${learned.has(t.id)?'checked':''}> I can explain this</label></div></details>`).join("")}
  ${next?`<p style="margin-top:20px"><button class="btn primary" data-next="${next.id}">Next module: ${esc(next.name)}</button></p>`:''}`;
  renderExplorers();
  renderWidgets($("#module"));
  renderNav();
  if(topicId){ const d = document.getElementById(topicId); if(d){ d.open = true; d.scrollIntoView({block:"start"}); } }
  else window.scrollTo({top:0});
}

$("#module").addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if(a){
    const ds = document.querySelectorAll("#module details.topic");
    if(a.dataset.act==="expand") ds.forEach(d=>d.open=true);
    if(a.dataset.act==="collapse") ds.forEach(d=>d.open=false);
    if(a.dataset.act==="markall"){ MODULES.find(m=>m.id===currentMod).topics.forEach(t=>learned.add(t.id)); store("prep-learned",[...learned]); openModule(currentMod); updateProgress(); }
  }
  const n = e.target.closest("[data-next]"); if(n) openModule(n.dataset.next);
  const cp = e.target.closest("[data-copy]");
  if(cp){ const code = cp.closest(".code").querySelector("code").textContent; try{ navigator.clipboard.writeText(code).then(()=>{ cp.textContent="Copied"; setTimeout(()=>cp.textContent="Copy",1500); }, ()=>{ cp.textContent="Select & copy"; }); }catch(err){ cp.textContent="Select & copy"; } }
  const s = e.target.closest("[data-stage]");
  if(s){ const box = s.closest(".explorer"); box.querySelectorAll("[data-stage]").forEach(b=>b.classList.toggle("on", b===s)); showStage(box, s.dataset.stage); }
});
$("#module").addEventListener("change", e => {
  const c = e.target.closest("[data-learn]"); if(!c) return;
  c.checked ? learned.add(c.dataset.learn) : learned.delete(c.dataset.learn);
  store("prep-learned", [...learned]);
  const dot = document.querySelector("#"+CSS.escape(c.dataset.learn)+" .check"); if(dot) dot.classList.toggle("done", c.checked);
  updateProgress();
});

function renderExplorers(){
  document.querySelectorAll("[data-explorer]").forEach(el => {
    const ex = EXPLORERS[el.dataset.explorer];
    el.className = "explorer"; el.dataset.which = el.dataset.explorer;
    el.innerHTML = `<h4>${esc(ex.title)}: tap a stage</h4>` + ex.lanes.map(([lane, stages]) => `<div class="stages"><span class="lane">${esc(lane)}</span>${stages.map((s,i)=>`<button data-stage="${esc(s)}">${esc(s)}</button>${i<stages.length-1?'<span aria-hidden="true" style="align-self:center;color:var(--muted)">›</span>':''}`).join("")}</div>`).join("") + `<div class="stagedetail" aria-live="polite"></div>`;
    const first = el.querySelector("[data-stage]"); first.classList.add("on"); showStage(el, first.dataset.stage);
  });
}
function showStage(box, name){
  const ex = EXPLORERS[box.dataset.which];
  box.querySelector(".stagedetail").innerHTML = `<h5>${esc(name)}</h5><p>${esc(ex.detail[name])}</p>`;
}

/* Flashcards */
let deck = CARDS.map((c,i)=>i), ci = 0, flipped = false;
let known = new Set(load("prep-known", []));
let onlyUnknown = false;
function activeDeck(){ const d = onlyUnknown ? deck.filter(i=>!known.has(i)) : deck; return d.length ? d : deck; }
function renderCards(){
  const d = activeDeck(); if(ci >= d.length) ci = 0;
  const c = CARDS[d[ci]];
  $("#v-cards").innerHTML = `<div class="fcwrap"><div class="modhead"><h2>Flashcards</h2><p>${CARDS.length} key terms. Tap the card to flip it. You know ${known.size} so far.</p></div>
  <div class="row"><button class="btn" id="fcshuf">Shuffle</button><button class="btn" id="fcfilter">${onlyUnknown?'Show all cards':'Only cards I don\'t know'}</button></div>
  <div class="fc ${flipped?'flip':''}" id="fc" tabindex="0" role="button" aria-label="Flip card"><div class="fcin"><div class="face"><div class="term">${esc(c[0])}</div><div class="hint">Tap to reveal the definition</div></div><div class="face back"><div class="def"><b>${esc(c[0])}</b><br>${esc(c[1])}</div></div></div></div>
  <p class="meta">Card ${ci+1} of ${d.length}${known.has(d[ci])?' · marked known':''}</p>
  <div class="row"><button class="btn" id="fcprev">Previous</button><button class="btn" id="fcagain">Review again</button><button class="btn primary" id="fcknow">I know this</button><button class="btn" id="fcnext">Next</button></div></div>`;
}
$("#v-cards").addEventListener("click", e => {
  const id = e.target.closest("button,#fc")?.id; if(!id) return;
  const d = activeDeck();
  if(id==="fc"){ flipped=!flipped; $("#fc").classList.toggle("flip", flipped); return; }
  if(id==="fcnext"){ ci=(ci+1)%d.length; flipped=false; }
  if(id==="fcprev"){ ci=(ci-1+d.length)%d.length; flipped=false; }
  if(id==="fcknow"){ known.add(d[ci]); store("prep-known",[...known]); flipped=false; if(!onlyUnknown) ci=(ci+1)%d.length; }
  if(id==="fcagain"){ known.delete(d[ci]); store("prep-known",[...known]); flipped=false; ci=(ci+1)%d.length; }
  if(id==="fcshuf"){ deck.sort(()=>Math.random()-.5); ci=0; flipped=false; }
  if(id==="fcfilter"){ onlyUnknown=!onlyUnknown; ci=0; flipped=false; }
  renderCards();
});
$("#v-cards").addEventListener("keydown", e => { if(e.target.id==="fc" && (e.key===" "||e.key==="Enter")){ e.preventDefault(); e.target.click(); } });

/* Quiz */
let quizState = null;
function startQuiz(){
  quizState = {order: QUIZ.map((_,i)=>i).sort(()=>Math.random()-.5), i:0, score:0, answered:false, picked:null};
  renderQuiz();
}
function renderQuiz(){
  const s = quizState;
  if(s.i >= s.order.length){
    const best = load("prep-best", 0); if(s.score > best) store("prep-best", s.score);
    $("#v-quiz").innerHTML = `<div class="qwrap"><div class="qcard"><h3>You scored ${s.score} out of ${s.order.length}</h3><p>${s.score >= s.order.length*0.85 ? "Excellent. You're ready for the deep-dive questions." : s.score >= s.order.length*0.6 ? "Solid base. Revisit the topics you missed in the Learn tab." : "Worth another pass through the Learn tab, then retry."}</p><p class="meta" style="text-align:left">Best score: ${Math.max(best, s.score)} / ${s.order.length}</p><button class="btn primary" id="qrestart">Restart quiz</button></div></div>`;
    return;
  }
  const q = QUIZ[s.order[s.i]];
  $("#v-quiz").innerHTML = `<div class="qwrap"><div class="modhead"><h2>Quiz</h2><p>Question ${s.i+1} of ${s.order.length} · Score ${s.score}</p></div><div class="qcard"><h3>${esc(q.q)}</h3>
  ${q.o.map((o,j)=>{ let cls=""; if(s.answered){ if(j===q.a) cls="right"; else if(j===s.picked) cls="wrong"; } return `<button class="opt ${cls}" data-opt="${j}" ${s.answered?'disabled':''}>${esc(o)}</button>`; }).join("")}
  ${s.answered?`<div class="why"><b>${s.picked===q.a?'Correct.':'Not quite.'}</b> ${esc(q.w)}</div><p style="margin-top:14px"><button class="btn primary" id="qnext">${s.i+1<s.order.length?'Next question':'See results'}</button></p>`:''}</div></div>`;
}
$("#v-quiz").addEventListener("click", e => {
  const o = e.target.closest("[data-opt]");
  if(o && !quizState.answered){ const q = QUIZ[quizState.order[quizState.i]]; quizState.picked=+o.dataset.opt; quizState.answered=true; if(quizState.picked===q.a) quizState.score++; renderQuiz(); }
  if(e.target.id==="qnext"){ quizState.i++; quizState.answered=false; quizState.picked=null; renderQuiz(); }
  if(e.target.id==="qrestart") startQuiz();
});

const strip = h => h.replace(/<[^>]+>/g," ").replace(/&[a-z]+;/g," ");
let lastView = "learn";
$("#q").addEventListener("input", e => {
  const term = e.target.value.trim().toLowerCase();
  if(term.length < 2){ if(activeView==="search") show(lastView); return; }
  if(activeView!=="search") lastView = activeView;
  const topics = ALL.filter(({t}) => (t.t+" "+strip(t.b)+" "+(t.tip||"")).toLowerCase().includes(term)).slice(0,30);
  const qs = QA.map((x,i)=>({x,i})).filter(({x}) => (x.q+" "+x.a).toLowerCase().includes(term)).slice(0,20);
  const cs = CARDS.filter(c => (c[0]+" "+c[1]).toLowerCase().includes(term)).slice(0,12);
  ["learn","qa","cards","quiz","cheat"].forEach(v => $("#v-"+v).hidden = true);
  $("#v-search").hidden = false; activeView = "search";
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected","false"));
  $("#v-search").innerHTML = `<div class="modhead"><h2>Results for “${esc(e.target.value.trim())}”</h2></div>
  ${!topics.length && !qs.length && !cs.length ? '<p class="empty">No matches. Try a shorter or different term, like "chunk", "MCP" or "LoRA".</p>' : ''}
  ${topics.length?`<h3>Topics</h3>${topics.map(({m,t})=>`<button class="res" data-goto="${m.id}|${t.id}"><b>${esc(t.t)}</b><small>${esc(m.name)}</small></button>`).join("")}`:''}
  ${qs.length?`<h3>Interview questions</h3>${qs.map(({x})=>`<details class="topic"><summary><span class="tt">${esc(x.q)}</span><span class="cat">${esc(x.c)}</span></summary><div class="body"><p>${esc(x.a)}</p></div></details>`).join("")}`:''}
  ${cs.length?`<h3>Glossary</h3>${cs.map(c=>`<div class="res"><b>${esc(c[0])}</b>${esc(c[1])}</div>`).join("")}`:''}`;
});
$("#v-search").addEventListener("click", e => {
  const g = e.target.closest("[data-goto]"); if(!g) return;
  const [mid, tid] = g.dataset.goto.split("|");
  $("#q").value = ""; show("learn"); openModule(mid, tid);
});

openModule(currentMod);
updateProgress();
</script>
</body>
</html>
