{t:"Shipping practices",b:`<ul><li>Version prompts, models, indexes and configs together.</li><li>Offline evals before release; A/B tests or shadow deployments after.</li><li>Fallbacks across providers; handle rate limits (429s) with backoff.</li><li>Graceful degradation (return sources only if generation fails).</li><li>Data privacy: PII handling, data residency, retention, zero-data-retention options.</li><li>Feedback loops: turn production failures into new eval cases.</li></ul>`}
]},
{id:"sec",name:"Safety, security & responsible AI",blurb:"Prompt injection, guardrails and governance. Increasingly asked in every AI interview.",topics:[
{t:"Prompt injection",b:`<ul><li><b>Direct</b>: the user writes "ignore previous instructions and...".</li><li><b>Indirect</b>: malicious instructions hidden in content the model reads: web pages, retrieved documents, emails, tool outputs, MCP tool descriptions. The most dangerous for RAG and agents.</li><li><b>The lethal trifecta</b> (Simon Willison): access to private data + exposure to untrusted content + ability to communicate externally = data exfiltration risk.</li></ul><p><b>Defenses</b> (no single one is complete):</p><ul><li>Treat all retrieved/tool content as untrusted data; clearly delimit it.</li><li>Least-privilege tools and credentials; separate read and write capabilities.</li><li>Human approval for sensitive actions.</li><li>Input and output classifiers; detect instructions in data.</li><li>Restrict outbound channels (no arbitrary URLs/images that leak data).</li><li>Dual-LLM / quarantined LLM patterns; never put secrets in prompts.</li></ul>`,tip:"Say clearly that prompt injection is not fully solved, so you design the system so a successful injection can't do much damage."},
{t:"OWASP Top 10 for LLM applications (2025)",b:`<ol><li>Prompt injection</li><li>Sensitive information disclosure</li><li>Supply chain vulnerabilities</li><li>Data and model poisoning</li><li>Improper output handling (e.g. rendering LLM output as HTML or SQL unescaped)</li><li>Excessive agency (too many permissions or autonomy)</li><li>System prompt leakage</li><li>Vector and embedding weaknesses (e.g. cross-tenant leaks, poisoned documents)</li><li>Misinformation</li><li>Unbounded consumption (cost and denial-of-service)</li></ol>`},
{t:"Guardrails",b:`<ul><li><b>Input guardrails</b>: topic filters, jailbreak/injection detection, PII detection and redaction.</li><li><b>Output guardrails</b>: moderation, schema validation, groundedness checks, PII and secret scanning, policy checks.</li><li>Tools: Llama Guard, NeMo Guardrails, Guardrails AI, provider moderation APIs, Microsoft Presidio for PII.</li><li>Balance safety with false positives and latency.</li></ul>`},
{t:"Responsible AI",b:`<ul><li>Bias and fairness testing; diverse eval sets.</li><li>Transparency: tell users they're talking to AI; show sources.</li><li><b>Red teaming</b>: adversarial testing before launch.</li><li>Privacy, consent and data governance.</li><li>Regulation: EU AI Act (risk-based tiers), sector rules (healthcare, finance), NIST AI Risk Management Framework.</li><li>Human oversight for consequential decisions.</li></ul>`}
]},
{id:"design",name:"System design walkthroughs",blurb:"How to structure a 'design a RAG system / agent' answer under interview pressure.",topics:[
{t:"Answer framework",b:`<ol><li><b>Clarify requirements</b>: users, use cases, data sources and size, update frequency, latency target, accuracy needs, languages, security and permissions, budget.</li><li><b>High-level architecture</b>: ingestion → index → retrieval → generation → serving.</li><li><b>Deep dive</b>: chunking, embeddings, vector DB, hybrid retrieval, reranking, prompt, model choice.</li><li><b>Evaluation</b>: offline eval set, metrics, online feedback.</li><li><b>Production</b>: latency, cost, caching, monitoring, scaling.</li><li><b>Safety</b>: access control, injection, PII, guardrails.</li><li><b>Iteration</b>: what you'd build first (MVP) and improve next.</li></ol>`,tip:"Spend the first minutes asking questions. Interviewers judge how you scope as much as the design."},
{t:"Example: enterprise document Q&A assistant",b:`<ul><li><b>Data</b>: Confluence, SharePoint, PDFs; nightly incremental sync via connectors; layout-aware parsing; metadata incl. ACLs, dates, source.</li><li><b>Indexing</b>: structure-aware chunks ~500 tokens with heading prefixes or contextual retrieval; embeddings in a vector DB with BM25 alongside.</li><li><b>Query</b>: condense follow-ups → hybrid search top 50 filtered by user permissions → cross-encoder rerank top 5 → prompt with numbered sources.</li><li><b>Generation</b>: answer only from context, cite sources, say "I don't know"; stream.</li><li><b>Eval</b>: 200 golden questions from SMEs; Recall@5, MRR, faithfulness, answer correctness; dashboards of thumbs-down.</li><li><b>Ops</b>: semantic cache for frequent questions, tracing, cost per query, p95 latency under ~3s.</li><li><b>Security</b>: ACL filtering, PII redaction, injection-aware prompts, audit logs.</li></ul>`},
{t:"Example: customer support agent",b:`<ul><li><b>Tools</b>: knowledge-base search (RAG), order lookup, refund request, ticket creation, handoff to human.</li><li><b>Flow</b>: router classifies intent → simple FAQs answered by RAG workflow → account actions go to a tool-using agent.</li><li><b>Guardrails</b>: refunds over a limit need human approval; verify identity before account data; policy documents in context; strict tool schemas.</li><li><b>Memory</b>: conversation state; customer profile and history.</li><li><b>Eval</b>: simulated customers (τ-bench style), resolution rate, escalation rate, CSAT, policy violations, pass^k consistency.</li><li><b>Reliability</b>: max steps, timeouts, fallbacks, full traces.</li></ul>`},
{t:"Trade-offs to say out loud",b:`<ul><li>Accuracy vs latency vs cost (bigger model, more chunks, reranking all cost time).</li><li>Workflow predictability vs agent flexibility.</li><li>Chunk size: precision vs context.</li><li>Managed vector DB (speed to ship) vs self-hosted (control, cost at scale).</li><li>API models (quality, no ops) vs open models (privacy, customization, fixed cost).</li><li>RAG vs fine-tuning vs long context.</li></ul>`}
]}
];

const EXPLORERS = {
rag:{title:"RAG pipeline",lanes:[["Offline indexing",["Load","Parse & clean","Chunk","Embed","Index & store"]],["Online query",["Query transform","Retrieve","Rerank","Augment prompt","Generate","Verify & cite"]]],
detail:{
"Load":"Pull documents from sources (PDF, HTML, Confluence, Drive, databases) with connectors. Track source, timestamps and permissions. Schedule incremental syncs.",
"Parse & clean":"Extract text and structure: headings, tables, lists. OCR scanned pages. Remove boilerplate and duplicates. Bad parsing is the most common hidden cause of bad answers.",
"Chunk":"Split into retrievable units: recursive or structure-aware splitting, 256–1024 tokens, 10–20% overlap. Consider parent-child chunks and contextual retrieval.",
"Embed":"Turn each chunk into a vector with an embedding model (same model later for queries). Batch for throughput; cache to avoid re-embedding unchanged chunks.",
"Index & store":"Write vectors plus metadata (source, title, date, ACL) into a vector DB using an ANN index like HNSW. Also build a BM25 index for hybrid search.",
"Query transform":"Rewrite unclear queries, condense follow-ups using chat history, generate multi-queries or HyDE, decompose complex questions, extract metadata filters, route to the right source.",
"Retrieve":"Hybrid search: BM25 + dense vectors, fused with Reciprocal Rank Fusion. Apply permission and metadata filters. Fetch generous top-k (e.g. 50).",
"Rerank":"A cross-encoder scores each (query, chunk) pair jointly and keeps the best 3–10. Optionally MMR for diversity. Big precision gain for modest latency.",
"Augment prompt":"Build the prompt: instructions, numbered chunks with sources, the question. Order by relevance, dedupe, compress, stay within the token budget.",
"Generate":"The LLM answers grounded in context, at low temperature, citing chunk IDs and saying 'I don't know' when the context lacks the answer. Stream the response.",
"Verify & cite":"Optionally check faithfulness (each claim supported?), attach source links, log the trace and collect feedback for evaluation."}},
agent:{title:"The agent loop",lanes:[["Loop",["Goal / input","Reason & plan","Act (tool call)","Observe result","Update memory","Check: done?"]]],
detail:{
"Goal / input":"A user request or task arrives with system instructions, available tool definitions and any relevant memory.",
"Reason & plan":"The LLM thinks about the current state and decides the next step, or writes a multi-step plan (ReAct thought, plan-and-execute).",
"Act (tool call)":"The model emits a structured tool call (name + JSON arguments). The runtime validates it, checks permissions, maybe asks a human, then executes it.",
"Observe result":"The tool result (or a helpful error) goes back into context. This environment feedback grounds the next decision.",
"Update memory":"State and scratchpad update; long histories get summarized; important facts may be saved to long-term memory.",
"Check: done?":"Stop when the goal is met (final answer), or when limits hit: max steps, budget, timeout, or a need for human input. Otherwise loop back to Reason."}}
};

const QA = [
{c:"LLM basics",q:"Explain how a Transformer works.",a:"Text is tokenized and embedded, with positional information added. Each layer applies multi-head self-attention, where every token computes query, key and value vectors and attends to other tokens via softmax(QKᵀ/√d)V, then a feed-forward network, each with residual connections and layer norm. Decoder-only LLMs use causal masking and predict the next token autoregressively."},
{c:"LLM basics",q:"What is the difference between temperature and top-p?",a:"Temperature rescales the whole probability distribution (lower = sharper, more deterministic). Top-p restricts sampling to the smallest set of tokens whose cumulative probability reaches p. Usually you tune one, not both."},
{c:"LLM basics",q:"Why do LLMs hallucinate and how do you reduce it?",a:"They're trained to produce plausible text, not verified truth, and they have knowledge gaps and cutoffs. Reduce it with RAG grounding and citations, allowing 'I don't know', low temperature, tool use for facts and calculations, verification passes and faithfulness evals."},
{c:"LLM basics",q:"What is the KV cache?",a:"During generation, keys and values computed for previous tokens are stored so each new token only computes attention for itself against the cache instead of recomputing the whole sequence. It speeds decoding but uses memory proportional to sequence length and batch size."},
{c:"LLM basics",q:"What is Mixture of Experts?",a:"A model with many expert sub-networks per layer where a learned router sends each token to only a few experts. Total parameters are large but compute per token stays low, improving efficiency."},
{c:"RAG",q:"What is RAG and why use it instead of fine-tuning?",a:"RAG retrieves relevant external knowledge at query time and adds it to the prompt. It gives fresh and private knowledge, citations, access control and easy updates without retraining. Fine-tuning is better for changing behavior, style or format than for injecting changing facts. 'Fine-tune for form, RAG for facts.'"},
{c:"RAG",q:"Walk me through a RAG pipeline end to end.",a:"Offline: load documents, parse and clean, chunk, embed, store vectors with metadata in a vector DB (plus a BM25 index). Online: transform the query, hybrid retrieve top-k with filters, rerank with a cross-encoder, build a prompt with numbered sources, generate a grounded answer with citations, then log and evaluate."},
{c:"RAG",q:"How do you choose chunk size?",a:"Start around 256–1024 tokens with 10–20% overlap, respecting document structure. Small chunks are precise but may lack context; large ones carry context but dilute embeddings. Then measure retrieval recall and answer quality on an eval set across a few sizes and pick empirically. Parent-child retrieval can get both benefits."},
{c:"RAG",q:"What is contextual retrieval?",a:"Before indexing, an LLM writes a short piece of context for each chunk explaining where it sits in the document (company, period, section), and that is prepended before embedding and BM25 indexing. It fixes chunks that lose meaning in isolation and notably reduces retrieval failures, especially combined with hybrid search and reranking."},
{c:"RAG",q:"How would you handle questions that need information from multiple documents?",a:"Query decomposition into sub-questions, multi-query retrieval, iterative or agentic retrieval that searches again based on what it found, larger top-k with reranking, and for corpus-wide themes, GraphRAG or hierarchical summaries (RAPTOR)."},
{c:"RAG",q:"When would you not use RAG?",a:"When knowledge is small and static enough to fit in context, when the task is about behavior or style rather than knowledge (fine-tune), when answers require exact aggregation over structured data (use SQL/tools), or when latency budgets can't afford retrieval."},
{c:"RAG",q:"What is GraphRAG and when is it better than vector RAG?",a:"It uses an LLM to build a knowledge graph of entities and relationships, clusters it into communities and summarizes them. It's better for multi-hop relationship questions and global questions like 'what are the main themes across all documents', at the cost of expensive indexing and harder updates."},
{c:"Retrieval",q:"Bi-encoder vs cross-encoder?",a:"A bi-encoder embeds query and document separately, so document vectors can be precomputed and searched fast: used for first-stage retrieval. A cross-encoder processes query and document together with full attention, which is more accurate but too slow for the whole corpus: used for reranking a shortlist."},
{c:"Retrieval",q:"What is hybrid search and how do you combine scores?",a:"Running lexical (BM25) and semantic (vector) retrieval and merging the results. Common fusion is Reciprocal Rank Fusion: score = Σ 1/(k + rank), k≈60, which needs no score normalization. Alternatively normalize scores and weight them with α."},
{c:"Retrieval",q:"Explain HyDE.",a:"Hypothetical Document Embeddings: the LLM first writes a hypothetical answer to the query, and you embed that answer instead of the raw question. Answer-shaped text tends to be closer in embedding space to real answer passages. Risk: if the hypothetical is wrong, retrieval can drift."},
{c:"Retrieval",q:"How does HNSW work?",a:"It builds a multi-layer graph where each vector links to its near neighbors; upper layers are sparse long-range links, lower layers dense. Search starts at the top and greedily moves toward the query, descending layers. It gives high recall with low latency but uses a lot of memory. efSearch trades recall for speed."},
{c:"Retrieval",q:"How do you enforce document permissions in RAG?",a:"Store ACL metadata (users, groups) with each chunk at ingestion, sync permission changes, and filter retrieval by the requesting user's identity so unauthorized chunks never reach the prompt. Never rely on the LLM to hide content."},
{c:"Evaluation",q:"How do you evaluate a RAG system?",a:"Separate retrieval from generation. Retrieval: Recall@k / hit rate, MRR, nDCG against labeled relevant chunks. Generation: faithfulness, answer relevance, correctness vs reference (RAGAS, LLM-as-judge calibrated with humans). Build a golden set from real queries including unanswerable ones, run it in CI, and track online feedback, latency and cost."},
{c:"Evaluation",q:"What is faithfulness vs answer relevance?",a:"Faithfulness: is every claim in the answer supported by the retrieved context (no hallucination)? Answer relevance: does the answer actually address the question? An answer can be faithful but irrelevant, or relevant but unfaithful."},
{c:"Evaluation",q:"What are the pitfalls of LLM-as-a-judge?",a:"Position bias, verbosity bias, self-preference, inconsistency and sensitivity to rubric wording. Mitigate with clear rubrics, binary or small scales, reasoning before scoring, swapping order in pairwise comparisons, and calibrating against human labels."},
{c:"Agents",q:"What is an AI agent? How is it different from a chatbot or workflow?",a:"An agent is an LLM that uses tools in a loop, deciding its own next step from environment feedback until a goal is met. A chatbot just responds; a workflow follows predefined code paths. Agents trade predictability and cost for flexibility on open-ended tasks."},
{c:"Agents",q:"Explain the ReAct pattern.",a:"The model alternates Thought (reasoning about what to do), Action (a tool call) and Observation (the result), repeating until it can answer. Reasoning guides tool use and observations ground reasoning, reducing hallucination."},
{c:"Agents",q:"What agent design patterns do you know?",a:"Prompt chaining, routing, parallelization (sectioning and voting), orchestrator-workers, evaluator-optimizer, and autonomous agents. Plus research patterns: ReAct, plan-and-execute, ReWOO, Reflexion, Tree of Thoughts, LATS, and multi-agent supervisor or handoff architectures."},
{c:"Agents",q:"How do you prevent an agent from looping forever or burning money?",a:"Max steps and token/cost budgets, timeouts, loop detection (same tool and args repeatedly), explicit finish criteria and a finish tool, checkpoints, and escalation to a human when stuck."},
{c:"Agents",q:"How do you evaluate agents?",a:"Task success on realistic scenarios graded by code checks where possible; trajectory checks for correct tool use and arguments; efficiency (steps, tokens, latency, cost); consistency with pass^k; safety violations. Use benchmarks like SWE-bench, τ-bench and GAIA for reference, and trace everything."},
{c:"Agents",q:"Single agent or multi-agent?",a:"Start with a single agent with good tools. Go multi-agent when tasks are parallelizable, benefit from specialization, or overflow one context window. Multi-agent costs many more tokens and adds coordination and debugging complexity."},
{c:"Agents",q:"What types of memory do agents use?",a:"Short-term memory is the context window and state. Long-term memory is stored externally and retrieved: episodic (past events), semantic (facts, preferences) and procedural (how-to, instructions). It needs policies for what to store, updating conflicts, forgetting, and privacy."},
{c:"Tools & MCP",q:"How does function calling work?",a:"You give the model tool names, descriptions and JSON schemas. The model outputs a structured call; your application executes it, returns the result, and the model continues. The model never executes code itself, so validation and permissions live in your code."},
{c:"Tools & MCP",q:"What is MCP and why does it matter?",a:"The Model Context Protocol is an open standard from Anthropic for connecting AI applications to tools and data. Hosts run clients that connect to servers exposing tools, resources and prompts over stdio or Streamable HTTP with JSON-RPC. It turns N×M custom integrations into N+M reusable ones."},
{c:"Tools & MCP",q:"MCP vs A2A?",a:"MCP connects an agent to tools and data sources. A2A (Agent2Agent) connects agents to other agents across vendors, using Agent Cards for discovery and task-based messaging. They're complementary."},
{c:"Tools & MCP",q:"What makes a good tool for an agent?",a:"Clear name and rich description, strict schema with examples, a focused purpose without overlap, concise relevant outputs with pagination, actionable error messages, idempotency and least privilege. Test tools with real tasks and iterate on descriptions."},
{c:"Fine-tuning",q:"Explain LoRA and QLoRA.",a:"LoRA freezes the pretrained weights and learns a low-rank update ΔW = B·A with small rank r, training a tiny fraction of parameters; adapters are small and swappable. QLoRA loads the frozen base model in 4-bit precision and trains LoRA adapters on top, making large-model fine-tuning possible on a single GPU."},
{c:"Fine-tuning",q:"RLHF vs DPO?",a:"RLHF trains a reward model on human preferences and then optimizes the LLM with RL (PPO) plus a KL penalty. DPO skips the reward model and RL, optimizing the model directly on chosen vs rejected pairs with a simple loss. DPO is simpler and more stable; RLHF can be more flexible."},
{c:"Production",q:"How would you reduce latency in a RAG app?",a:"Stream output; use smaller or faster models for routing and rewriting; parallelize retrievals; use a lighter reranker or fewer candidates; reduce chunks in the prompt; cache embeddings, results and prompt prefixes; semantic cache for frequent questions; keep outputs concise."},
{c:"Production",q:"How would you reduce cost?",a:"Model routing and cascades, prompt caching, semantic caching, batch APIs for offline work, fewer and better chunks, history compression, and fine-tuning or distilling a smaller model for high-volume narrow tasks. Monitor cost per request."},
{c:"Production",q:"What would you monitor in production?",a:"Traces of every retrieval, LLM and tool call; latency p50/p95; token usage and cost; error and rate-limit rates; quality via online evals and user feedback; 'I don't know' rate; drift in query topics; safety and guardrail triggers."},
{c:"Safety",q:"What is prompt injection and how do you defend against it?",a:"Malicious instructions that hijack the model, either directly from the user or indirectly via retrieved documents, web pages or tool outputs. Defend in layers: treat external content as untrusted data, least-privilege tools, human approval for sensitive actions, input/output classifiers, restrict exfiltration channels, and design so a successful injection has limited impact."},
{c:"Safety",q:"What is 'excessive agency'?",a:"An OWASP LLM risk where an LLM system has more functionality, permissions or autonomy than it needs, so a manipulated or mistaken model can do real damage. Fix with minimal tools, scoped credentials and human approval."},
{c:"System design",q:"Design a chatbot over 1 million company documents.",a:"Clarify users, latency, permissions and update rates. Ingest with connectors and layout-aware parsing, structure-aware chunks with context prefixes, store embeddings plus ACL metadata in a scalable vector DB with BM25. Query: condense, hybrid retrieve top 50 with permission filters, rerank to top 5, generate with citations. Evaluate with a golden set and RAGAS metrics, monitor with tracing, add caching, and secure against injection and leaks."},
{c:"System design",q:"How would you improve a RAG system that gives wrong answers?",a:"First inspect traces to see whether the right chunk was retrieved. If not: fix parsing, chunking, add hybrid search, query rewriting, reranking, contextual retrieval or embedding fine-tuning. If retrieved but answered wrong: reduce noise, reorder context, improve the prompt, use a stronger model, add verification. Measure each change on the eval set."},
{c:"Behavioral",q:"Tell me about a RAG or agent project you built.",a:"Use STAR: Situation (business problem, users, data), Task (your role and goal), Action (architecture choices and why: chunking, retrieval, model, evaluation, a problem you debugged), Result (measured metrics such as accuracy, latency, cost, adoption, and what you'd do next). Mention trade-offs and one failure you learned from."},
{c:"Behavioral",q:"How do you keep up with the fast-moving AI field?",a:"Name concrete sources: papers (arXiv, Papers with Code), engineering blogs from model labs, newsletters, building small prototypes, reading framework release notes, and evaluating new techniques on your own data before adopting them."}
];

const CARDS = [
["Token","The subword unit a model reads and writes; about 4 characters of English."],
["Embedding","Dense vector representing meaning; similar meaning → nearby vectors."],
["Self-attention","Each token weighs all other tokens via softmax(QKᵀ/√d)V to build context-aware representations."],
["Context window","Maximum tokens of input plus output a model can handle in one call."],
["Temperature","Sampling parameter controlling randomness; low = focused, high = creative."],
["Top-p","Nucleus sampling: choose only from tokens covering cumulative probability p."],
["Hallucination","Fluent but false or unsupported model output."],
["KV cache","Stored keys and values of past tokens to speed up generation."],
["Quantization","Storing weights at lower precision (INT8/INT4) to save memory and speed up inference."],
["Mixture of Experts","Router activates only a few expert sub-networks per token."],
["Chain-of-thought","Prompting the model to reason step by step before answering."],
["Self-consistency","Sample multiple reasoning paths and take the majority answer."],
["RAG","Retrieve relevant external knowledge at query time and add it to the prompt for grounded answers."],
["Chunking","Splitting documents into retrievable pieces, typically 256–1024 tokens with overlap."],
["Semantic chunking","Splitting where embedding similarity between adjacent sentences drops."],
["Parent-child retrieval","Match on small chunks, return their larger parent section."],
["Contextual retrieval","Prepend LLM-written document context to each chunk before embedding and BM25 indexing."],
["Late chunking","Embed the whole document first, then pool token vectors per chunk."],
["Cosine similarity","Angle-based similarity; equals dot product for normalized vectors."],
["HNSW","Hierarchical Navigable Small World graph; fast high-recall ANN index."],
["IVF","Inverted file index: cluster vectors, search only nearest clusters (nprobe)."],
["Product quantization","Compresses vectors into short codes to save memory."],
["BM25","Lexical ranking using term frequency, IDF and length normalization."],
["Hybrid search","Combining lexical (BM25) and semantic (vector) retrieval."],
["Reciprocal Rank Fusion","Fuses ranked lists: score = Σ 1/(k + rank), k≈60."],
["Bi-encoder","Encodes query and document separately; fast, used for retrieval."],
["Cross-encoder","Encodes query and document together; accurate, used for reranking."],
["ColBERT","Late-interaction retrieval with per-token vectors and MaxSim scoring."],
["HyDE","Embed an LLM-generated hypothetical answer instead of the raw query."],
["Multi-query / RAG-Fusion","Generate several query variants, retrieve for each, fuse results."],
["MMR","Maximal Marginal Relevance: balance relevance and diversity of results."],
["Lost in the middle","Models use info at the start and end of long contexts better than the middle."],
["Self-RAG","Model decides when to retrieve and critiques its own outputs with reflection tokens."],
["Corrective RAG","Grades retrieved docs; falls back to rewriting or web search if weak."],
["GraphRAG","Knowledge graph plus community summaries for multi-hop and global questions."],
["RAPTOR","Recursive clustering and summarization into a tree for multi-level retrieval."],
["Recall@k","Share of relevant items found within the top k results."],
["MRR","Mean Reciprocal Rank: average 1/rank of the first relevant result."],
["nDCG","Position-aware ranking metric supporting graded relevance."],
["Faithfulness","Every claim in the answer is supported by the retrieved context."],
["Context precision","Relevant chunks are ranked high in retrieved context."],
["Context recall","Retrieved context contains all info needed for the reference answer."],
["LLM-as-a-judge","Using an LLM with a rubric to grade outputs."],
["AI agent","An LLM using tools in a loop, deciding its own next steps toward a goal."],
["ReAct","Interleaving Thought → Action → Observation steps."],
["Plan-and-Execute","Plan all steps up front, execute, re-plan when needed."],
["Reflexion","Agent writes reflections on failures into memory to improve next attempts."],
["Orchestrator-workers","Central LLM decomposes a task dynamically and delegates to workers."],
["Evaluator-optimizer","One LLM generates, another critiques, in a loop."],
["Function calling","Model outputs structured tool calls (name + JSON args) that your code executes."],
["MCP","Model Context Protocol: open standard connecting AI apps to tools, resources and prompts."],
["A2A","Agent2Agent protocol for communication between agents; uses Agent Cards."],
["Episodic memory","Memory of specific past events and interactions."],
["Semantic memory","Stored facts and preferences."],
["Procedural memory","Knowledge of how to do things; instructions and skills."],
["pass^k","Probability an agent succeeds on all k attempts; measures consistency."],
["LoRA","Train low-rank adapter matrices while base weights stay frozen."],
["QLoRA","LoRA on top of a 4-bit quantized base model."],
["RLHF","Reward model from human preferences, then RL (PPO) to optimize the LLM."],
["DPO","Direct Preference Optimization on chosen/rejected pairs; no reward model."],
["Distillation","Training a small student model to mimic a large teacher."],
["Semantic cache","Return cached answers for queries similar in embedding space."],
["Prompt caching","Provider reuses computation for a repeated prompt prefix."],
["TTFT","Time to first token; key perceived-latency metric."],
["vLLM","High-throughput LLM serving engine using PagedAttention and continuous batching."],
["Speculative decoding","Draft model proposes tokens; large model verifies in parallel."],
["Prompt injection","Malicious instructions that hijack the model, directly or via retrieved content."],
["Excessive agency","Giving an LLM system more permissions or autonomy than needed."],
["Guardrails","Input/output checks enforcing safety, format and policy."]
];

{id:"s1",step:1,level:"Basic",name:"Generative AI & the Claude family",blurb:"Where generative AI came from, what foundation models are, and how Claude fits in. Interviews usually start here.",topics:[
{t:"Evolution of generative AI (interactive timeline)",b:`<p>Tap the years to walk from rule-based chatbots to today's agentic models.</p>${W("timeline")}
<p><b>The big shifts to mention</b>: rules → statistical ML → deep learning → <b>Transformers (2017)</b> → large-scale pretraining → instruction tuning and alignment (ChatGPT/Claude era) → tool use, long context and agents.</p>`,tip:"Tell the story in 30 seconds: 'Transformers made massive pretraining possible, alignment made models useful assistants, and tool use plus long context turned them into agents.'"},
{t:"Foundation models",b:`<p>A <b>foundation model</b> (term popularized by Stanford in 2021) is a large model pretrained on broad data that can be adapted to many downstream tasks by prompting, retrieval or fine-tuning.</p>
<ul><li><b>Properties</b>: trained once at huge cost, reused everywhere; general capabilities; in-context learning; emergent skills at scale.</li><li><b>Modalities</b>: text (LLMs), images (diffusion models), audio, video, and multimodal models that mix them. Claude takes text, images and PDFs as input and produces text.</li><li><b>Adaptation ladder</b>: prompt engineering → RAG → tool use → fine-tuning → training from scratch (rarely worth it).</li><li><b>Risks</b>: hallucination, bias inherited from data, homogenization (one model's flaws spread everywhere), cost and energy.</li></ul>`},
{t:"Core LLM concepts (quick recap)",b:`<ul><li><b>Token</b>: subword unit; pricing and limits are in tokens (about 4 characters per token in English).</li><li><b>Next-token prediction</b>: the model generates one token at a time.</li><li><b>Context window</b>: everything the model sees in one request (input + output).</li><li><b>Temperature</b>: randomness of sampling.</li><li><b>Embeddings</b>: vectors that represent meaning; the basis of semantic search.</li><li><b>Hallucination</b>: confident but wrong output.</li><li><b>Alignment</b>: training models to be helpful, honest and harmless (for Claude, partly via Constitutional AI).</li></ul>${GO("llm","LLM foundations")}`},
{t:"The Claude model family",b:`<p>Claude comes in tiers that trade capability against speed and cost. The current API lineup (from Anthropic's docs, mid-2026):</p>
<div class="tbl"><table><tr><th>Model</th><th>API ID</th><th>Positioning</th><th>Context</th><th>Price in / out per MTok</th></tr>
<tr><td>Claude Fable 5.1</td><td><code>claude-fable-5-1</code></td><td>Mythos tier; highest capability for demanding reasoning and long-horizon agents; slower</td><td>1M</td><td>$10 / $50</td></tr>
<tr><td>Claude Opus 5.5</td><td><code>claude-opus-5-5</code></td><td>Complex agentic coding and enterprise work</td><td>1M</td><td>$4 / $20</td></tr>
<tr><td>Claude Sonnet 5.5</td><td><code>claude-sonnet-5-5</code></td><td>Best balance of speed and intelligence</td><td>1M</td><td>$2 / $10</td></tr>
<tr><td>Claude Haiku 5.5</td><td><code>claude-haiku-5-5</code></td><td>Fastest and most cost-efficient</td><td>1M</td><td>See pricing page</td></tr></table></div>
<ul><li><b>Mythos tier</b>: Claude Fable 5.1 and Claude Mythos 5.1 share the same underlying model; Fable adds extra safeguards for biology, cybersecurity and LLM R&amp;D. Claude Mythos Preview is limited to trusted organizations through Project Glasswing.</li><li>All current models take text and image input, support tool use, vision and many languages, and produce up to 128K output tokens per request.</li><li>Available through the Claude API and cloud platforms (Amazon Bedrock, Google Cloud, Microsoft Foundry).</li><li>Older names you may hear: Claude 3 Haiku/Sonnet/Opus (2024), Claude 3.5 Sonnet, Claude 4 family (2025), Claude Opus 5 / Sonnet 5.</li></ul>${W("tree","model")}
<p class="wnote">Model names, prices and limits change. Check the models overview and pricing pages on the Claude Platform docs before the interview.</p>`,tip:"Don't memorize prices; explain the trade-off: bigger tier = smarter but slower and pricier, so route each task to the cheapest model that passes your evals."},
{t:"Claude use cases",b:`<ul><li><b>Coding and agentic coding</b>: Claude Code, code review, refactoring, test writing, debugging.</li><li><b>Knowledge assistants (RAG)</b>: chat over company docs with citations.</li><li><b>Document understanding</b>: long contracts, reports and PDFs (charts and tables via vision), thanks to 1M-token context.</li><li><b>Data extraction</b>: invoices, resumes, emails → validated JSON with structured outputs.</li><li><b>Customer support agents</b>: tool use to look up orders, create tickets, hand off to humans.</li><li><b>Research agents</b>: web search tool, multi-step investigation, synthesis.</li><li><b>Content and analysis</b>: summarization, drafting, translation, classification, sentiment.</li><li><b>Computer use and browser agents</b>: operate UIs from screenshots.</li><li><b>Office work</b>: Claude in Excel, PowerPoint and Chrome; Claude Cowork for knowledge work.</li></ul>`},

<tr><td>Claude</td><td>Anthropic</td><td>Coding and agentic work, long context, careful instruction following, safety research (Constitutional AI), creator of MCP</td><td>API, Bedrock, Google Cloud, Microsoft Foundry</td></tr>
<tr><td>GPT</td><td>OpenAI</td><td>Large ecosystem, broad multimodality including image generation</td><td>API, Azure</td></tr>
<tr><td>Gemini</td><td>Google</td><td>Native multimodality (including video), long context, Google ecosystem</td><td>API, Vertex AI</td></tr>
<tr><td>Llama, Mistral, Qwen, DeepSeek, Gemma</td><td>Various</td><td>Open weights: self-hosting, fine-tuning, data control, no per-token API fees</td><td>Download / host yourself or via providers</td></tr></table></div>
<p><b>How to answer "Why Claude?"</b>: there's no universally best model. Compare candidates on <i>your</i> eval set, plus latency, cost, context needs, safety, data-privacy terms, cloud availability and ecosystem (SDKs, MCP, tooling).</p>`,tip:"Stay neutral and evidence-based. 'I'd benchmark on our task' beats brand loyalty in every interview."}
]},
{id:"s2",step:2,level:"Basic",name:"Claude setup: safety, context, console & SDKs",blurb:"Constitutional AI, context windows, choosing a model, and getting your environment ready to call the API.",topics:[
{t:"Constitutional AI (flowchart)",b:`<p><b>Constitutional AI</b> (Anthropic, Bai et al., Dec 2022) trains a model to be helpful and harmless using a written set of principles (a "constitution") instead of relying only on human labels of harmful content.</p>${W("flow","cai")}
<ul><li><b>Phase 1, supervised</b>: the model critiques and revises its own answers against principles; it's fine-tuned on the revisions.</li><li><b>Phase 2, RL from AI feedback (RLAIF)</b>: an AI compares pairs of answers using the principles; those labels train a preference model used for reinforcement learning.</li><li><b>Why it matters</b>: scalable oversight (less human labeling of toxic content), transparent values you can read and change, and models that explain refusals instead of being evasive.</li></ul>`,tip:"Contrast with RLHF: RLHF gets preferences from humans; CAI gets most harmlessness preferences from AI guided by explicit principles."},
{t:"Context windows",b:`<p>The context window is the total tokens Claude can consider in one request: system prompt, tool definitions, conversation history, documents <i>and</i> the output it generates.</p><ul><li>Current Claude models support up to <b>1M tokens</b>; older models such as Claude Sonnet 4.5 have 200K.</li><li>Rough scale: 1M tokens ≈ 750K English words ≈ several thick books.</li><li>Bigger context costs more and is slower; quality can drop if it's full of irrelevant text.</li><li>Count tokens before sending with the token-counting endpoint (<code>client.messages.count_tokens</code>).</li><li>Some Claude models have <b>context awareness</b>: they're told their remaining token budget.</li></ul>${W("ctx")}`},
{t:"Model selection",b:`<p>Decide with criteria, then confirm with evals:</p><ol><li><b>Task difficulty</b>: simple extraction/classification vs multi-step reasoning or agentic coding.</li><li><b>Latency</b>: real-time chat needs fast models and streaming.</li><li><b>Cost and volume</b>: millions of calls per day push you to smaller tiers.</li><li><b>Context and output length</b> needs.</li><li><b>Features</b>: thinking, tool use, vision, structured outputs, availability on your cloud.</li><li><b>Evaluate</b> two or three candidates on 50–200 real examples; pick the cheapest that passes.</li></ol><p><b>Routing pattern</b>: a fast model classifies the request; easy ones stay on the small model, hard ones go to a bigger one.</p>${W("tree","model")}`},
{t:"Anthropic Console (Claude Platform)",b:`<p>The developer console, now at <b>platform.claude.com</b>, is where you manage API work:</p><ul><li><b>Workbench</b>: test prompts, system prompts, parameters and tools in the browser, then click "Get code" to export Python/TypeScript.</li><li><b>Prompt tools</b>: prompt generator and prompt improver; variables with <code>{{double_braces}}</code>; evaluation runs on test cases.</li><li><b>API keys</b> and <b>workspaces</b> (separate keys, limits and spend per team or environment).</li><li><b>Usage and cost dashboards</b>, rate limits per tier, billing.</li><li>Organization members and roles.</li></ul>`},
{t:"API keys",b:`<ul><li>Create a key in the console; it's shown once and starts with <code>sk-ant-</code>.</li><li>Store it in an environment variable named <code>ANTHROPIC_API_KEY</code>; the SDKs read it automatically.</li><li>Use separate keys per app and environment (dev, staging, prod) and per workspace, so you can revoke one without breaking others.</li><li>Never commit keys, paste them into frontend code, or log them. Rotate regularly and revoke immediately if leaked.</li></ul>${C(`
# .env  (add .env to .gitignore!)
ANTHROPIC_API_KEY=sk-ant-xxxxxxxx
`,"dotenv")}`},

source .venv/bin/activate          # Windows: .venv\\Scripts\\activate

<p><b>VS Code checklist</b>: install the Python + Pylance (or ESLint + Prettier) extensions; select the <code>.venv</code> interpreter; create <code>.env</code> and <code>.gitignore</code>; add a debug configuration; optional: Docker, REST Client/Thunder Client, GitLens, and the Claude Code extension for AI-assisted coding.</p>
<p><b>First call (Python)</b></p>${C(`
from dotenv import load_dotenv
import anthropic

load_dotenv()                    # loads ANTHROPIC_API_KEY from .env
client = anthropic.Anthropic()

msg = client.messages.create(
    model="claude-sonnet-5-5",
    max_tokens=500,
    messages=[{"role": "user", "content": "Explain RAG in two sentences."}],
)
print(msg.content[0].text)
`,"Python")}
<p><b>First call (JavaScript)</b></p>${C(`
import "dotenv/config";
