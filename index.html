<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interview prep: Claude, RAG, AI agents & LLMs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --ink:#1A2230; --muted:#586274; --line:#D3D9E2;
  --accent:#2A55BE; --accent-soft:#E1E8F8; --marker:#F6D985; --good:#1F7A4D; --bad:#B23A3A;
  --good-soft:#DDF1E5; --bad-soft:#F7E0E0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131823; --surface:#1C2330; --ink:#E5E9F0; --muted:#9AA4B5; --line:#2E3747;
    --accent:#86A6FF; --accent-soft:#25304A; --marker:#6B5420; --good:#6BD39B; --bad:#F08A8A;
    --good-soft:#1E3A2C; --bad-soft:#402326;
  }
}
:root[data-theme="dark"]{
  --bg:#131823; --surface:#1C2330; --ink:#E5E9F0; --muted:#9AA4B5; --line:#2E3747;
  --accent:#86A6FF; --accent-soft:#25304A; --marker:#6B5420; --good:#6BD39B; --bad:#F08A8A;
  --good-soft:#1E3A2C; --bad-soft:#402326;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Serif 4",Georgia,serif;font-size:17px;line-height:1.6}
h1,h2,h3,button,input,select,summary,.ui{font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em;background:var(--accent-soft);padding:.1em .35em;border-radius:4px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.hrow{display:flex;align-items:center;gap:14px;padding:14px 0 10px;flex-wrap:wrap}
.hrow h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-.01em;flex:1 1 auto}
.prog{font-family:Manrope,sans-serif;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.bar{width:110px;height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);width:0;transition:width .3s}
.search{flex:1 1 260px;max-width:360px;font-size:15px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:0}
nav.tabs button{border:0;background:none;color:var(--muted);font-weight:700;font-size:14.5px;padding:9px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{padding:22px 0 60px}
.learn-grid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px}
.side{position:sticky;top:130px;align-self:start;max-height:calc(100vh - 150px);overflow:auto}
.side button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;color:var(--ink);font-size:14px;font-weight:600;padding:8px 10px;border-radius:8px;cursor:pointer}
.side button:hover{background:var(--accent-soft)}
.side button.on{background:var(--accent);color:#fff}
:root[data-theme="dark"] .side button.on{color:#111}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .side button.on{color:#10141c}}
.side small{opacity:.75;font-weight:500}
.modsel{display:none;width:100%;font-size:15px;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin-bottom:16px}
@media (max-width:860px){.learn-grid{grid-template-columns:1fr}.side{display:none}.modsel{display:block}}
.modhead h2{font-size:30px;line-height:1.15;margin:0 0 6px;font-weight:800;letter-spacing:-.02em}
.modhead p{color:var(--muted);margin:0 0 18px;max-width:68ch}
.modtools{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.btn{font-family:Manrope,sans-serif;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;border-radius:9px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#10141c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#10141c}}
details.topic{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.topic>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:16.5px}
details.topic>summary::-webkit-details-marker{display:none}
details.topic>summary::before{content:"+";font-weight:800;color:var(--accent);width:14px;flex:none}
details.topic[open]>summary::before{content:"\2212"}
.tt{flex:1}
.check{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.check.done{background:var(--good);border-color:var(--good)}
.body{padding:0 18px 16px 40px;max-width:78ch}
.body p{margin:.5em 0}
.body ul,.body ol{margin:.4em 0;padding-left:1.25em}
.body li{margin:.25em 0}
.tip{background:var(--marker);padding:8px 12px;border-radius:8px;margin-top:12px!important}
.learnbox{display:inline-flex;gap:8px;align-items:center;margin-top:10px;font-family:Manrope,sans-serif;font-weight:600;font-size:14px;cursor:pointer}
.learnbox input{width:18px;height:18px;accent-color:var(--good)}
.tbl{overflow-x:auto;margin:.6em 0}
.tbl table{border-collapse:collapse;font-size:15px;min-width:520px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.tbl th{font-family:Manrope,sans-serif;background:var(--accent-soft)}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:.6em 0;font-family:Manrope,sans-serif;font-size:13.5px;font-weight:700}
.flow span{background:var(--accent-soft);padding:5px 10px;border-radius:7px}
.flow b{color:var(--muted);font-weight:800}
.explorer{border:1px solid var(--line);border-radius:12px;padding:14px;margin:.8em 0;background:var(--bg)}
.explorer h4{font-family:Manrope,sans-serif;margin:0 0 4px;font-size:14px;color:var(--muted)}
.stages{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.stages button{font-family:Manrope,sans-serif;font-size:13.5px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 10px;cursor:pointer}
.stages button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.stages .lane{width:100%;font-family:Manrope,sans-serif;font-size:12.5px;font-weight:700;color:var(--muted);margin-top:4px}
.stagedetail{background:var(--surface);border-radius:9px;padding:10px 14px;min-height:80px}
.stagedetail h5{font-family:Manrope,sans-serif;font-size:16px;margin:0 0 4px}
/* Q&A */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chips button{font-family:Manrope,sans-serif;font-size:13.5px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:6px 12px;cursor:pointer}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat{font-family:Manrope,sans-serif;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:10px;flex:none}
/* flashcards */
.fcwrap{max-width:640px;margin:0 auto}
.fc{perspective:1200px;height:300px;cursor:pointer;margin:12px 0}
.fcin{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flip .fcin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;justify-content:center;padding:24px;overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .term{font-family:Manrope,sans-serif;font-size:30px;font-weight:800;letter-spacing:-.02em;text-align:center}
.face .hint{font-family:Manrope,sans-serif;font-size:13px;color:var(--muted);text-align:center;margin-top:12px}
.face .def{font-size:18px}
@media (prefers-reduced-motion:reduce){.fcin{transition:none}.bar i{transition:none}}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.meta{font-family:Manrope,sans-serif;font-size:14px;color:var(--muted);text-align:center}
/* quiz */
.qwrap{max-width:700px;margin:0 auto}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.qcard h3{font-size:20px;margin:6px 0 14px;line-height:1.35}
.opt{display:block;width:100%;text-align:left;font-family:"Source Serif 4",Georgia,serif;font-size:16.5px;padding:11px 14px;margin:7px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.why{margin-top:12px;padding:10px 14px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
/* cheat */
.cheat{columns:2 340px;column-gap:22px}
.cheat section{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:16px}
.cheat h3{font-size:16px;margin:2px 0 6px}
.cheat ul{margin:0;padding-left:1.1em;font-size:15.5px}
.results h3{font-size:15px;color:var(--muted);margin:18px 0 8px}
.res{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer;color:var(--ink);font-family:"Source Serif 4",Georgia,serif;font-size:15.5px}
.res b{font-family:Manrope,sans-serif;display:block;font-size:15px}
.res small{color:var(--muted)}
.empty{color:var(--muted);font-style:italic}
.theme{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 10px;cursor:pointer;font-size:14px}

.trackh{font-family:Manrope,sans-serif;font-size:12.5px;font-weight:800;color:var(--muted);padding:14px 10px 6px;letter-spacing:.01em}
.trackh:first-child{padding-top:2px}
.side em{font-style:normal;opacity:.65;font-weight:700}
.pill{display:inline-block;font-family:Manrope,sans-serif;font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:20px;margin-bottom:8px;background:var(--accent-soft);color:var(--accent)}
.pill.lv-basic{background:var(--good-soft);color:var(--good)}
.pill.lv-advanced{background:var(--bad-soft);color:var(--bad)}
.goto{font-family:Manrope,sans-serif;font-size:13.5px;font-weight:700;border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:6px 11px;margin:8px 6px 0 0;cursor:pointer}
.code{margin:.7em 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.codebar{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 4px 12px;border-bottom:1px solid var(--line);font-family:Manrope,sans-serif;font-size:12px;font-weight:700;color:var(--muted)}
.copy{font-family:Manrope,sans-serif;font-size:12px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:3px 9px;cursor:pointer}
.code pre{margin:0;padding:12px 14px;overflow-x:auto;font-size:13px;line-height:1.5}
.code pre code{background:none;padding:0;font-size:inherit}
.widget{border:1px solid var(--line);border-radius:12px;padding:14px;margin:.9em 0;background:var(--bg)}
.widget h4{font-family:Manrope,sans-serif;margin:0 0 4px;font-size:15px}
.wnote{font-size:14.5px;color:var(--muted);margin:0 0 10px!important}
.wdetail{background:var(--surface);border-radius:9px;padding:10px 14px;margin-top:10px;min-height:56px;font-size:15.5px}
.wdetail p{margin:.3em 0 0}
.flowchart{display:flex;flex-direction:column;align-items:center;gap:0}
.fnode{font-family:Manrope,sans-serif;font-size:14px;font-weight:700;border:2px solid var(--accent);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 14px;cursor:pointer;max-width:420px;width:100%;text-align:center;line-height:1.3}
.fnode.start{background:var(--accent);color:#fff}
.fnode.end{background:var(--good-soft);border-color:var(--good)}
.fnode.dec{border-style:dashed;border-color:#C08A1E;background:var(--marker)}
.fnode.on{outline:3px solid var(--ink);outline-offset:2px}
:root[data-theme="dark"] .fnode.start{color:#10141c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .fnode.start{color:#10141c}}
.arrow{width:2px;height:22px;background:var(--muted);position:relative;margin:2px 0 6px}
.arrow::after{content:"";position:absolute;bottom:-6px;left:-5px;border:6px solid transparent;border-top-color:var(--muted);border-bottom:0}
.fgroup{border:1.5px dashed var(--line);border-radius:12px;padding:8px;width:100%;max-width:560px;text-align:center}
.glabel{display:block;font-family:Manrope,sans-serif;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.frow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.frow .fnode{width:auto;flex:1 1 120px}
.loopback{font-family:Manrope,sans-serif;font-size:13px;font-weight:700;color:var(--accent);margin-top:8px}
.seqscroll{overflow-x:auto}
.seq{min-width:520px}
.seqhead{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:4px;margin-bottom:4px}
.actor{font-family:Manrope,sans-serif;font-size:13px;font-weight:800;text-align:center;background:var(--surface);border:2px solid var(--ink);border-radius:8px;padding:6px 4px}
.seqrow{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);min-height:50px;cursor:pointer}
.lifelines{position:absolute;inset:0;display:grid;grid-template-columns:repeat(var(--n),1fr);pointer-events:none}
.lifelines span{background:linear-gradient(var(--line),var(--line)) center/2px 100% no-repeat}
.msg{position:relative;align-self:center;padding:0 calc(50% / var(--span));transition:opacity .2s}
.mlabel{display:block;font-family:Manrope,sans-serif;font-size:12px;font-weight:700;text-align:center;line-height:1.25;padding:0 4px 3px;background:var(--bg)}
.mline{display:block;height:2px;background:var(--accent);position:relative}
.msg.r .mline::after{content:"";position:absolute;right:-1px;top:-5px;border:6px solid transparent;border-left-color:var(--accent);border-right:0}
.msg.l .mline::before{content:"";position:absolute;left:-1px;top:-5px;border:6px solid transparent;border-right-color:var(--accent);border-left:0}
.msg.self .mlabel{border:2px solid var(--accent);border-radius:8px;background:var(--surface);padding:4px}
.msg.self .mline{display:none}
.seqrow.hid .msg{opacity:.13}
.seqrow.cur .mlabel{color:var(--accent)}
.seqrow.cur .mline{height:3px}
.row.left{justify-content:flex-start;align-items:center;margin-top:10px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:Manrope,sans-serif;font-size:13px;margin-bottom:8px}
.crumbs span{background:var(--accent-soft);padding:3px 8px;border-radius:6px}
.crumbs b{color:var(--muted)}
.tq{font-family:Manrope,sans-serif;font-weight:700;font-size:16px;margin:4px 0 10px}
.topts{display:flex;flex-direction:column;gap:7px}
.topts .btn{text-align:left}
.result{background:var(--good-soft);border:1px solid var(--good);border-radius:10px;padding:10px 14px;margin-bottom:10px}
.result b{font-family:Manrope,sans-serif}
.tl{display:flex;gap:2px;overflow-x:auto;padding:6px 0 4px;position:relative}
.tl button{flex:none;border:0;background:none;color:var(--ink);font-family:Manrope,sans-serif;font-size:12.5px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 7px;border-radius:8px}
.tl .dot{width:14px;height:14px;border-radius:50%;background:var(--line);border:2px solid var(--accent)}
.tl button.on .dot{background:var(--accent)}
.tl button.on{background:var(--accent-soft)}
.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:Manrope,sans-serif;font-size:14px;font-weight:700;margin:6px 0}
.ctl input[type=range]{flex:1 1 180px;accent-color:var(--accent)}
.ctl output{min-width:44px;color:var(--accent)}
.barrow{display:grid;grid-template-columns:78px 1fr 54px;gap:8px;align-items:center;font-family:Manrope,sans-serif;font-size:13.5px;margin:4px 0}
.bt{height:16px;background:var(--surface);border-radius:4px;overflow:hidden}
.bt i{display:block;height:100%;background:var(--accent);transition:width .2s}
.barrow.cut{opacity:.4}
.bv{text-align:right}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 12px}
.form label{display:flex;flex-direction:column;gap:3px;font-family:Manrope,sans-serif;font-size:13px;font-weight:700;color:var(--muted)}
.form input,.form select,.form textarea{font-size:15px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-family:inherit}
.chk{display:flex!important;flex-direction:row!important;align-items:flex-start;gap:8px;font-family:Manrope,sans-serif;font-size:14px;font-weight:600;margin:6px 0;color:var(--ink)!important;cursor:pointer}
.chk input{margin-top:3px;width:17px;height:17px;flex:none;accent-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:12px}
.kpi{background:var(--surface);border-radius:9px;padding:9px 12px;font-family:Manrope,sans-serif}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:12.5px;color:var(--muted)}
.stack{display:flex;height:28px;border-radius:7px;overflow:hidden;background:var(--surface);border:1px solid var(--line);margin:10px 0 6px}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-family:Manrope,sans-serif;font-size:12.5px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c)}
.chunks{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.chunk{background:var(--surface);border-left:5px solid var(--c);border-radius:6px;padding:7px 10px;font-size:14.5px}
.chunk small{display:block;font-family:Manrope,sans-serif;font-weight:700;color:var(--muted);font-size:12px}
.chunk mark{background:var(--marker);color:inherit}
.tabsm{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 0}
.tabsm button{font-family:Manrope,sans-serif;font-size:13px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px 8px 0 0;padding:6px 11px;cursor:pointer}
.tabsm button.on{background:var(--ink);color:var(--bg)}
.errgrid{display:flex;flex-wrap:wrap;gap:6px}
.errgrid button{font-family:Manrope,sans-serif;font-weight:800;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer}
.errgrid button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.meter{height:16px;border-radius:9px;background:var(--surface);border:1px solid var(--line);overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;transition:width .3s}
.attack{background:var(--bad-soft);border:1px solid var(--bad);border-radius:8px;padding:8px 12px;font-size:14.5px;margin-bottom:8px}
.svgbox{background:var(--surface);border-radius:10px;padding:6px;max-width:460px}
.svgbox svg{width:100%;height:auto;display:block}
.svgbox text{font-family:Manrope,sans-serif;fill:var(--ink)}
.pt{cursor:pointer}
.mini{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.mini th,.mini td{border:1px solid var(--line);padding:5px 8px;text-align:left}
.mini th{font-family:Manrope,sans-serif;background:var(--accent-soft)}

<script>
/* ===================== CONTENT ===================== */
const MODULES = [
{id:"llm",name:"LLM foundations",blurb:"How large language models actually work. Interviewers often open here before moving to RAG and agents.",topics:[
{t:"What is a large language model?",b:`<p>An LLM is a neural network (almost always a <b>Transformer</b>) trained to predict the <b>next token</b> given previous tokens. Trained on trillions of tokens, it learns grammar, facts, reasoning patterns and code. Generation is <b>autoregressive</b>: predict a token, append it, repeat.</p>
<ul><li><b>Base model</b>: raw pretrained next-token predictor; continues text.</li><li><b>Instruct / chat model</b>: further trained to follow instructions and converse safely.</li><li><b>Parameters</b>: learned weights (billions). More parameters + data + compute generally means better capability (scaling laws).</li><li><b>Open-weight</b> (Llama, Mistral, Qwen, DeepSeek, Gemma) vs <b>closed / API</b> models (Claude, GPT, Gemini).</li></ul>`,tip:"One crisp line: \"An LLM is a Transformer trained on next-token prediction, then aligned with instruction tuning and preference optimization.\""},
{t:"Tokens and tokenization",b:`<p>Models read <b>tokens</b>, not words. Tokenizers split text into subword units using <b>BPE</b> (Byte-Pair Encoding, used by GPT-style models), <b>WordPiece</b> (BERT) or <b>SentencePiece/Unigram</b> (T5, Llama).</p>
<ul><li>Rule of thumb in English: 1 token ≈ 4 characters ≈ 0.75 words.</li><li>Pricing, context limits and speed are all measured in tokens.</li><li>Non-English languages and code often use more tokens per word.</li><li>Tokenization explains classic failures: counting letters in a word, reversing strings, arithmetic on long numbers.</li></ul>`,tip:"If asked why LLMs can't count the r's in 'strawberry', answer: the model sees subword tokens, not individual characters."},
{t:"Transformer architecture and attention",b:`<p>Introduced in <i>Attention Is All You Need</i> (2017). Key pieces:</p>
<ul><li><b>Self-attention</b>: every token builds a <b>Query</b>, <b>Key</b> and <b>Value</b>. Attention = <code>softmax(QKᵀ / √d) · V</code>. Each token mixes information from all other tokens weighted by relevance.</li><li><b>Multi-head attention</b>: several attention heads in parallel learn different relationships.</li><li><b>Positional encoding</b>: attention has no notion of order, so position is injected (sinusoidal, learned, <b>RoPE</b>, ALiBi).</li><li><b>Feed-forward layers</b>, <b>residual connections</b> and <b>layer normalization</b> in each block.</li><li><b>Causal masking</b> in decoders so a token can't see future tokens.</li></ul>
<div class="tbl"><table><tr><th>Type</th><th>Examples</th><th>Good for</th></tr><tr><td>Encoder-only</td><td>BERT, RoBERTa</td><td>Classification, embeddings, rerankers</td></tr><tr><td>Decoder-only</td><td>GPT, Claude, Llama</td><td>Text generation, chat, agents</td></tr><tr><td>Encoder-decoder</td><td>T5, BART</td><td>Translation, summarization</td></tr></table></div>
<p>Standard attention cost grows <b>quadratically</b> (O(n²)) with sequence length, which is why long context is expensive. FlashAttention, sparse/sliding-window attention and other tricks reduce this.</p>`,tip:"Be ready to explain Q, K, V with an analogy: query = what I'm looking for, key = what I contain, value = what I hand over if matched."},
{t:"Embeddings",b:`<p>An <b>embedding</b> is a dense vector (e.g. 384 to 3072 numbers) representing meaning. Texts with similar meaning land close together in vector space.</p>
<ul><li><b>Token embeddings</b> live inside the model; <b>sentence/document embeddings</b> come from dedicated embedding models and power search.</li><li>Used for semantic search, RAG retrieval, clustering, deduplication, classification, recommendation, anomaly detection.</li><li>Similarity measured with cosine similarity, dot product or Euclidean distance.</li></ul>`,tip:"Mention that query and documents must be embedded with the same model (and same version) or the vectors are not comparable."},
{t:"Context window",b:`<p>The maximum number of tokens (input + output) a model can process in one call. Modern models range from ~8k up to 1M+ tokens.</p>
<ul><li>Longer context = higher cost and latency (input tokens are billed; attention is expensive).</li><li><b>Lost in the middle</b> (Liu et al., 2023): models use information at the start and end of long contexts better than the middle.</li><li><b>Context rot</b>: quality can degrade as context fills with irrelevant material.</li><li><b>Context engineering</b>: deliberately choosing what goes into the window (instructions, retrieved chunks, tool results, memory) so it stays relevant and compact.</li></ul>`},
{t:"Decoding and sampling parameters",b:`<ul><li><b>Temperature</b>: scales the probability distribution. Low (0 to 0.3) = focused, consistent; high (0.8+) = creative, varied.</li><li><b>Top-p (nucleus)</b>: sample only from the smallest set of tokens whose cumulative probability ≥ p.</li><li><b>Top-k</b>: sample only from the k most likely tokens.</li><li><b>Max tokens</b>: output cap. <b>Stop sequences</b>: strings that end generation.</li><li><b>Frequency / presence penalties</b>: discourage repetition.</li><li><b>Greedy</b> (always top token) vs <b>beam search</b> (keep several candidate sequences) vs <b>sampling</b>.</li></ul><p>Temperature 0 is close to deterministic but not guaranteed identical across runs due to floating-point and batching effects.</p>`,tip:"For RAG Q&A and extraction, say you use low temperature; for brainstorming, higher."},
{t:"How LLMs are trained (pretraining to alignment)",b:`<div class="flow"><span>Pretraining</span><b>›</b><span>SFT / instruction tuning</span><b>›</b><span>Preference alignment</span><b>›</b><span>RL for reasoning (optional)</span></div>
<ol><li><b>Pretraining</b>: self-supervised next-token prediction on massive web, books and code. Most of the compute; produces the base model.</li><li><b>Supervised fine-tuning (SFT)</b>: train on curated instruction → response pairs.</li><li><b>Preference alignment</b>: <b>RLHF</b> (humans rank outputs → train a reward model → optimize with PPO), <b>DPO</b> (optimize directly on preference pairs, no reward model), <b>RLAIF / Constitutional AI</b> (AI feedback guided by written principles).</li><li><b>Reinforcement learning with verifiable rewards</b>: reward correct math answers or passing tests to teach long-form reasoning (e.g. GRPO).</li></ol>`},
{t:"Hallucination",b:`<p>When a model produces fluent, confident output that is false or unsupported.</p><p><b>Causes</b>: training rewards plausible text, not truth; knowledge gaps or cutoff; ambiguous prompts; pressure to answer instead of saying "I don't know"; bad retrieved context.</p><p><b>Mitigations</b>:</p><ul><li>Ground with RAG and require citations to sources.</li><li>Explicitly allow "I don't know / not in context".</li><li>Lower temperature for factual tasks.</li><li>Verification step: a second pass or judge checks claims against sources (faithfulness check).</li><li>Self-consistency (sample several answers, compare).</li><li>Structured outputs and tool use (calculators, databases) for facts the model shouldn't guess.</li></ul>`,tip:"Distinguish intrinsic hallucination (contradicts the source) from extrinsic (adds unverifiable info)."},
{t:"Reasoning models and test-time compute",b:`<p>Reasoning models generate an extended internal chain of thought ("thinking") before answering. They trade more tokens, latency and cost for big gains on math, coding, planning and multi-step problems.</p><ul><li><b>Test-time compute scaling</b>: performance improves by letting the model think longer, sample more, or verify more at inference time, not just by training bigger.</li><li>Often configurable with a thinking budget or effort level.</li><li>Use them for complex agent planning; use fast small models for simple routing, classification and extraction.</li></ul>`},
{t:"Efficiency: KV cache, quantization, MoE and more",b:`<ul><li><b>KV cache</b>: stores keys and values of past tokens so each new token doesn't recompute attention over the whole sequence. Memory grows with context length and batch size.</li><li><b>Quantization</b>: store weights in lower precision (FP16 → INT8 / INT4). Formats and methods: GPTQ, AWQ, GGUF (llama.cpp), bitsandbytes. Smaller and faster, small accuracy loss.</li><li><b>Mixture of Experts (MoE)</b>: many expert feed-forward blocks; a router activates only a few per token. Huge total parameters, much lower compute per token (Mixtral, DeepSeek).</li><li><b>FlashAttention</b>: IO-aware exact attention, faster and memory-efficient.</li><li><b>Speculative decoding</b>: a small draft model proposes tokens, the big model verifies them in parallel.</li><li><b>Distillation</b>: train a small student model to mimic a large teacher.</li><li><b>GQA / MQA</b>: share keys/values across heads to shrink the KV cache.</li></ul>`},
{t:"Scaling laws and multimodality",b:`<ul><li><b>Scaling laws</b> (Kaplan 2020): loss falls predictably as a power law with parameters, data and compute.</li><li><b>Chinchilla</b> (2022): compute-optimal training uses roughly 20 tokens per parameter; many earlier models were undertrained.</li><li><b>Emergent abilities</b>: some skills appear to jump at certain scales (debated; partly a metric artifact).</li><li><b>Multimodal models</b>: accept images, audio, video or documents along with text. <b>CLIP</b> learns a shared image-text embedding space, which enables image search and multimodal RAG.</li><li><b>Small language models (SLMs)</b>: compact models for on-device, low-latency or cheap tasks.</li></ul>`}
]},
{id:"prompt",name:"Prompt & context engineering",blurb:"Techniques to get reliable outputs. Shows up in every RAG and agent question.",topics:[
{t:"Core prompting techniques",b:`<ul><li><b>Zero-shot</b>: just the instruction.</li><li><b>Few-shot / in-context learning</b>: include worked examples of input → output. Diverse, representative examples matter more than many.</li><li><b>System prompt / role</b>: sets persona, rules, format, guardrails.</li><li><b>Clear, specific instructions</b>: say what to do (not only what not to do), audience, length, format.</li><li><b>Delimiters / XML tags</b>: separate instructions from data, e.g. <code>&lt;context&gt;...&lt;/context&gt;</code>. Also helps against injection.</li><li><b>Give the model an out</b>: "If the answer isn't in the context, say so."</li><li><b>Prefill</b>: start the assistant's reply to force a format.</li></ul>`},
{t:"Chain-of-thought and reasoning prompts",b:`<ul><li><b>Chain-of-thought (CoT)</b> (Wei 2022): ask the model to reason step by step before answering. Improves math and logic.</li><li><b>Zero-shot CoT</b>: just add "Let's think step by step."</li><li><b>Self-consistency</b>: sample multiple reasoning paths at higher temperature, take the majority answer.</li><li><b>Tree of Thoughts</b>: explore and evaluate branching reasoning paths with search.</li><li><b>Least-to-most</b>: solve simpler sub-problems first.</li><li><b>Step-back prompting</b>: first ask a more general question about the principle, then answer.</li></ul>`},
{t:"Structured output",b:`<ul><li><b>JSON mode / structured outputs</b>: force valid JSON matching a schema.</li><li><b>Function / tool calling</b> as a way to get typed arguments.</li><li><b>Constrained decoding</b>: grammars restrict tokens to valid outputs (Outlines, guidance, llama.cpp grammars).</li><li><b>Validate and retry</b>: parse with Pydantic / Zod; on failure, send the error back and retry.</li></ul>`,tip:"Mention 'validate + retry with the error message' as your production pattern."},
{t:"Prompt chaining and context engineering",b:`<p><b>Prompt chaining</b>: split a task into sequential LLM calls, each with a focused prompt (outline → draft → critique → final). Easier to debug and evaluate; add programmatic checks ("gates") between steps.</p><p><b>Context engineering</b> is the broader discipline of filling the context window with exactly the right information: system instructions, retrieved knowledge, tool definitions, tool results, conversation history and memory. Techniques: summarize/compact old turns, retrieve just-in-time, trim tool outputs, give sub-agents clean separate contexts.</p>`},
{t:"Prompt caching",b:`<p>Providers can cache the computed prefix of a prompt (system prompt, tool definitions, large documents). Later calls that share that exact prefix are cheaper and faster.</p><ul><li>Put stable content first, variable content (user question) last.</li><li>Huge win for agents (long, repeated tool definitions) and RAG with a fixed knowledge preamble.</li><li>Different from <b>semantic caching</b>, which reuses whole answers for similar queries.</li></ul>`},
{t:"Prompt optimization and versioning",b:`<ul><li>Treat prompts as code: version control, review, regression tests against an eval set.</li><li><b>DSPy</b>: write programs of LM modules with signatures; optimizers automatically tune prompts and few-shot examples against a metric.</li><li>Automatic prompt optimization: an LLM proposes prompt edits, an eval scores them.</li><li>Change one thing at a time and measure.</li></ul>`}
]},
{id:"rag",name:"RAG fundamentals",blurb:"Retrieval-Augmented Generation: what it is, why it exists, and the full pipeline end to end.",topics:[
{t:"What is RAG and why use it?",b:`<p><b>Retrieval-Augmented Generation</b> (Lewis et al., 2020) retrieves relevant information from an external knowledge source at query time and adds it to the prompt so the LLM answers grounded in that information.</p><p><b>Why</b>:</p><ul><li>LLMs have a knowledge cutoff and don't know your private data.</li><li>Reduces hallucination by grounding answers.</li><li>Enables <b>citations</b> and traceability.</li><li>Update knowledge by re-indexing, no retraining.</li><li>Enforce <b>access control</b> per user at retrieval time.</li><li>Cheaper than fine-tuning to inject knowledge.</li></ul><p><b>Limits</b>: answer quality is capped by retrieval quality; adds latency; struggles with global "summarize everything" questions and multi-hop reasoning without advanced techniques.</p>`,tip:"Say: 'RAG = retrieval + augmentation + generation. The R is usually the bottleneck, so I invest most in retrieval quality and evaluation.'"},
{t:"The RAG pipeline (interactive)",b:`<p>Tap any stage to see what happens there, the common choices and what to say about it.</p><div data-explorer="rag"></div>`},
{t:"RAG vs fine-tuning vs long context",b:`<div class="tbl"><table><tr><th></th><th>RAG</th><th>Fine-tuning</th><th>Long context</th></tr><tr><td>Best for</td><td>Knowledge, facts, fresh or private data</td><td>Behavior, style, format, domain jargon, narrow tasks</td><td>Small, fixed doc sets; whole-document reasoning</td></tr><tr><td>Update data</td><td>Easy (re-index)</td><td>Hard (retrain)</td><td>Easy (change prompt)</td></tr><tr><td>Citations</td><td>Yes</td><td>No</td><td>Possible</td></tr><tr><td>Cost</td><td>Retrieval infra + tokens</td><td>Training cost, cheaper inference</td><td>High tokens per call</td></tr><tr><td>Hallucination</td><td>Reduced</td><td>Can still hallucinate facts</td><td>Lost-in-the-middle risk</td></tr></table></div><p>They combine well: fine-tune a model to follow your RAG format and cite properly, or fine-tune the embedding model for your domain.</p>`,tip:"Classic line: 'Fine-tune for form, RAG for facts.'"},
{t:"Document ingestion and parsing",b:`<ul><li><b>Loaders</b> for PDFs, Word, HTML, Confluence, Notion, Google Drive, databases, Slack.</li><li><b>Parsing</b> is often the hardest part: multi-column PDFs, tables, headers/footers, scanned pages (OCR). Layout-aware tools: Unstructured, LlamaParse, Docling, Azure Document Intelligence, AWS Textract.</li><li><b>Cleaning</b>: strip boilerplate, nav menus, duplicate pages; normalize whitespace and encoding.</li><li><b>Metadata</b>: source URL, title, section heading, author, date, document type, permissions/ACL, version. Used for filtering, citations and freshness.</li><li><b>Incremental indexing</b>: detect changes (hashes, timestamps), upsert changed chunks, delete removed docs.</li><li><b>Deduplication</b>: near-duplicate docs waste top-k slots.</li></ul>`,tip:"Interviewers love hearing 'garbage in, garbage out': most RAG quality issues trace back to bad parsing and chunking."},
{t:"Prompt template for RAG",b:`<p>A typical generation prompt:</p><p><code>System: You answer using only the provided context. If the answer isn't there, say you don't know. Cite sources as [doc_id].</code><br><code>&lt;context&gt; [1] chunk... [2] chunk... &lt;/context&gt;</code><br><code>Question: ...</code></p><ul><li>Number or ID each chunk so the model can cite.</li><li>Include metadata (title, date) to help it judge relevance and freshness.</li><li>Put the question after the context for long contexts.</li><li>Ask for quotes first, then the answer, for high-stakes faithfulness.</li></ul>`}
]},
{id:"chunk",name:"Chunking strategies",blurb:"How you split documents decides what can be found. A favorite interview deep-dive.",topics:[
{t:"Why chunk at all?",b:`<ul><li>Embedding models have input limits (often 512 to 8k tokens).</li><li>One vector for a whole long document blurs many topics into one point, so precision drops.</li><li>Context budget: you can only fit a handful of passages in the prompt.</li><li>Smaller units allow precise citations.</li></ul>`},
{t:"Chunking methods",b:`<div class="tbl"><table><tr><th>Method</th><th>How</th><th>Pros / cons</th></tr><tr><td>Fixed-size</td><td>Every N tokens with overlap</td><td>Simple, fast; cuts mid-sentence or mid-idea</td></tr><tr><td>Recursive character</td><td>Split on paragraphs, then sentences, then words until size fits</td><td>Sensible default (LangChain RecursiveCharacterTextSplitter)</td></tr><tr><td>Structure-aware</td><td>Split by Markdown/HTML headings, pages, code functions (AST)</td><td>Keeps logical sections; needs good parsing</td></tr><tr><td>Semantic</td><td>Embed sentences, split where similarity between neighbors drops</td><td>Topic-coherent chunks; slower, variable size</td></tr><tr><td>Sentence-window</td><td>Index single sentences, return surrounding window</td><td>Precise matching plus context</td></tr><tr><td>LLM / agentic</td><td>LLM decides boundaries or extracts propositions</td><td>High quality; expensive</td></tr></table></div>`},
{t:"Chunk size and overlap trade-offs",b:`<ul><li><b>Small chunks</b> (100 to 300 tokens): precise embeddings, but may lack context to answer.</li><li><b>Large chunks</b> (800 to 1500 tokens): more context, but diluted embeddings and more noise in the prompt.</li><li>Common starting point: <b>256 to 1024 tokens</b> with <b>10 to 20% overlap</b>.</li><li>Overlap preserves ideas that cross a boundary; too much overlap wastes storage and creates near-duplicates.</li><li>The right size depends on the content and question type. <b>Tune it with an eval set</b>, don't guess.</li></ul>`,tip:"Never give a single magic number; say what you'd start with and how you'd measure."},
{t:"Parent-child (small-to-big) retrieval",b:`<p>Index <b>small child chunks</b> for precise matching, but when one matches, return its <b>larger parent</b> section to the LLM. Variants: sentence-window retrieval, hierarchical/auto-merging retrieval (if many children of one parent match, merge into the parent).</p><p>Related: <b>multi-vector retrieval</b> stores several vectors per document (summary, hypothetical questions, raw chunks) all pointing to the same source.</p>`},
{t:"Contextual retrieval and late chunking",b:`<ul><li><b>Problem</b>: a chunk like "Revenue grew 3% over the previous quarter" has lost which company and which quarter.</li><li><b>Contextual retrieval</b> (Anthropic, 2024): before indexing, use an LLM to prepend a short chunk-specific explanation drawn from the whole document; index that for both embeddings and BM25. Anthropic reported that this substantially cut retrieval failures, and even more when combined with reranking. Prompt caching makes it affordable.</li><li><b>Late chunking</b>: run a long-context embedding model over the whole document first, then pool token embeddings per chunk, so every chunk vector carries document context.</li><li>Cheaper alternative: prepend document title and section heading to each chunk.</li></ul>`},
{t:"Tables, images and code",b:`<ul><li><b>Tables</b>: keep them whole; convert to Markdown or HTML; optionally index an LLM-written summary while returning the raw table.</li><li><b>Images / charts</b>: caption with a vision model, or use multimodal embeddings (CLIP, ColPali page-image retrieval).</li><li><b>Code</b>: split by function/class using the syntax tree; include file path and signatures.</li><li><b>Slides / FAQs</b>: one slide or one Q&amp;A pair per chunk.</li></ul>`}
]},
{id:"vec",name:"Embeddings & vector databases",blurb:"Turning text into vectors and finding nearest neighbors fast at scale.",topics:[
{t:"Embedding models",b:`<ul><li><b>Bi-encoders</b> embed query and document independently, enabling precomputed document vectors and fast search.</li><li>Popular options: OpenAI text-embedding-3, Cohere Embed, Voyage, Google, and open-source BGE, E5, GTE, Nomic, Jina, sentence-transformers.</li><li>Compare on the <b>MTEB</b> leaderboard, then validate on your own data.</li><li>Considerations: dimension (storage vs quality), max input length, multilingual support, domain fit, cost, latency, hosting.</li><li><b>Asymmetric search</b>: some models want prefixes like <code>query:</code> and <code>passage:</code>.</li><li><b>Matryoshka embeddings</b>: trained so you can truncate dimensions (3072 → 256) with modest quality loss.</li><li><b>Fine-tune embeddings</b> on domain query-passage pairs (contrastive loss, hard negatives) for big retrieval gains.</li><li>Changing the embedding model means <b>re-embedding the whole corpus</b>.</li></ul>`},
{t:"Similarity metrics",b:`<ul><li><b>Cosine similarity</b>: angle between vectors; ignores magnitude. Most common for text.</li><li><b>Dot product</b>: cosine × magnitudes. If vectors are normalized to length 1, dot product = cosine (and faster).</li><li><b>Euclidean (L2) distance</b>: straight-line distance; on normalized vectors it ranks the same as cosine.</li><li>Use whatever metric the embedding model was trained with.</li></ul>`},
{t:"Approximate nearest neighbor (ANN) indexes",b:`<p>Exact k-NN compares the query with every vector: O(N), too slow at millions of vectors. ANN trades a little recall for big speedups.</p><div class="tbl"><table><tr><th>Index</th><th>Idea</th><th>Notes</th></tr><tr><td><b>HNSW</b></td><td>Multi-layer proximity graph; greedy search from coarse to fine layers</td><td>Excellent recall and speed; memory heavy. Params: M, efConstruction, efSearch</td></tr><tr><td><b>IVF</b></td><td>Cluster vectors (k-means); search only the nearest clusters</td><td>Param nprobe; needs training</td></tr><tr><td><b>PQ</b></td><td>Product quantization compresses vectors into codes</td><td>Huge memory savings, lower accuracy; often IVF-PQ</td></tr><tr><td>LSH</td><td>Hash similar vectors into the same buckets</td><td>Simple, less used now</td></tr><tr><td>DiskANN / ScaNN</td><td>Disk-based graph / Google's quantized search</td><td>Billion-scale</td></tr></table></div>`,tip:"Know HNSW's trade-off: higher efSearch means better recall but slower queries."},
{t:"Vector databases and how to choose",b:`<ul><li><b>Managed</b>: Pinecone, Zilliz (Milvus), Weaviate Cloud, Qdrant Cloud.</li><li><b>Open source</b>: Milvus, Qdrant, Weaviate, Chroma (lightweight, prototyping), LanceDB.</li><li><b>Extensions of existing DBs</b>: pgvector (Postgres), Elasticsearch / OpenSearch, Redis, MongoDB Atlas Vector Search.</li><li><b>Library, not a DB</b>: FAISS (Meta), Annoy, hnswlib.</li></ul><p><b>Selection criteria</b>: scale and latency, metadata filtering quality, hybrid (BM25 + vector) support, multi-tenancy, updates/deletes, managed vs self-hosted ops, cost, security/compliance, existing stack. "Just use Postgres + pgvector" is a strong answer for moderate scale.</p>`},
{t:"Metadata filtering, multi-tenancy and access control",b:`<ul><li><b>Pre-filtering</b>: apply the filter, then search within matches. Accurate but can be slow or break ANN graphs if very selective.</li><li><b>Post-filtering</b>: search, then filter. Fast but can return fewer than k results.</li><li>Good engines do filtered ANN natively.</li><li><b>Multi-tenancy</b>: namespaces or collections per tenant, or a tenant_id filter.</li><li><b>Access control</b>: store ACLs as metadata and filter by the user's permissions <i>at retrieval time</i>, so the LLM never sees documents the user can't access.</li></ul>`,tip:"Bringing up permission-aware retrieval unprompted shows enterprise maturity."}
]},
{id:"retr",name:"Retrieval & reranking",blurb:"Getting the right chunks into the top-k: lexical, semantic, hybrid, reranking and query rewriting.",topics:[
{t:"Sparse / lexical retrieval (BM25)",b:`<p><b>BM25</b> ranks by term overlap, weighting rare terms higher (IDF), with term-frequency saturation (<code>k1</code>) and document length normalization (<code>b</code>).</p><ul><li>Strong on exact matches: product codes, error IDs, names, acronyms, legal citations.</li><li>Weak on synonyms and paraphrases ("car" vs "automobile").</li><li><b>SPLADE</b>: learned sparse vectors that expand terms with related words.</li></ul>`},
{t:"Dense / semantic retrieval",b:`<p>Embed query and chunks, return nearest vectors. Captures meaning and paraphrase, works cross-lingually. Weak spots: exact identifiers, rare jargon, numbers, negation, and out-of-domain text.</p>`},
{t:"Hybrid search and Reciprocal Rank Fusion",b:`<p>Run BM25 and vector search in parallel, then fuse the lists. This usually beats either alone.</p><ul><li><b>Reciprocal Rank Fusion (RRF)</b>: <code>score(d) = Σ 1 / (k + rank_i(d))</code>, with k ≈ 60. Uses only ranks, so no score normalization is needed.</li><li><b>Weighted fusion</b>: normalize scores and combine with α (e.g. 0.5 dense + 0.5 sparse).</li><li>Supported natively by Weaviate, Elasticsearch, OpenSearch, Qdrant, Pinecone and others.</li></ul>`,tip:"Write the RRF formula from memory; it's a frequent whiteboard question."},
{t:"Reranking",b:`<p>Two-stage retrieval: fast recall first, precise ranking second.</p><div class="flow"><span>Retrieve top 50–100 (hybrid)</span><b>›</b><span>Cross-encoder rerank</span><b>›</b><span>Keep top 3–10</span><b>›</b><span>LLM</span></div><ul><li><b>Cross-encoder</b>: feeds query and document together into one transformer, scoring relevance with full token interaction. Much more accurate than bi-encoders but too slow to run over the whole corpus.</li><li>Options: Cohere Rerank, BGE-reranker, Jina reranker, Voyage rerank, cross-encoder/ms-marco models, LLM-as-reranker.</li><li><b>ColBERT</b> (late interaction): stores per-token vectors, scores with MaxSim. Between bi-encoder and cross-encoder in cost and quality.</li></ul>`,tip:"Explain bi-encoder (separate encoding, fast, precomputable) vs cross-encoder (joint encoding, accurate, slow)."},
{t:"Query transformation",b:`<ul><li><b>Query rewriting</b>: LLM cleans up vague or typo-filled queries.</li><li><b>Conversational condensing</b>: turn "what about its pricing?" plus chat history into a standalone query.</li><li><b>Multi-query / RAG-Fusion</b>: generate several paraphrases, retrieve for each, fuse with RRF.</li><li><b>HyDE</b> (Hypothetical Document Embeddings): LLM writes a hypothetical answer; embed that instead of the question, since answer-like text sits closer to real answers.</li><li><b>Step-back</b>: also retrieve for a more general version of the question.</li><li><b>Decomposition</b>: split multi-part or multi-hop questions into sub-questions, retrieve for each.</li><li><b>Self-query / metadata extraction</b>: LLM extracts filters ("2023 reports from finance") from the question.</li></ul>`},
{t:"Routing, MMR and top-k",b:`<ul><li><b>Query routing</b>: classify the query and send it to the right index, tool, SQL database, web search, or straight to the LLM with no retrieval.</li><li><b>MMR (Maximal Marginal Relevance)</b>: picks results that are relevant <i>and</i> different from already-picked ones, avoiding five near-identical chunks.</li><li><b>Top-k</b>: too low misses information; too high adds noise and cost. Use a similarity threshold to allow returning nothing.</li></ul>`},
{t:"Context assembly and compression",b:`<ul><li>Deduplicate and order chunks; put the strongest evidence first (and/or last) because of lost-in-the-middle.</li><li><b>Contextual compression</b>: extract only relevant sentences from each chunk (LLM extractor, LLMLingua).</li><li>Include source IDs for citations; respect the token budget.</li><li>Post-generation: verify each claim maps to a cited chunk.</li></ul>`}
]},
{id:"adv",name:"Advanced RAG patterns",blurb:"Beyond naive RAG: self-correcting, agentic, graph-based and multimodal approaches.",topics:[
{t:"Naive, advanced and modular RAG",b:`<ul><li><b>Naive RAG</b>: chunk, embed, top-k, stuff into prompt.</li><li><b>Advanced RAG</b>: adds pre-retrieval (better chunking, query rewriting, metadata), better retrieval (hybrid), post-retrieval (reranking, compression).</li><li><b>Modular RAG</b>: interchangeable modules, routing, loops and iterative retrieval (from the Gao et al. RAG survey).</li></ul>`},
{t:"Self-RAG, Corrective RAG and Adaptive RAG",b:`<ul><li><b>Self-RAG</b>: model trained to decide <i>when</i> to retrieve and to critique its retrieval and its own answers via reflection tokens.</li><li><b>Corrective RAG (CRAG)</b>: a grader rates retrieved docs as relevant / ambiguous / irrelevant; if weak, rewrite the query or fall back to web search before generating.</li><li><b>Adaptive RAG</b>: route by question complexity: no retrieval, single-step, or iterative multi-step retrieval.</li><li>Commonly built as graphs in LangGraph with grading nodes and loops.</li></ul>`},
{t:"Agentic RAG",b:`<p>An agent treats retrieval as a tool it can call repeatedly. It decides whether to search, what to search for, which source to use (vector DB, SQL, web, API), reads results, and searches again until it has enough.</p><ul><li>Handles multi-hop questions ("Who manages the team that built product X, and what's their budget?").</li><li>Costs: more latency, more tokens, less predictable. Use when single-shot retrieval fails.</li></ul>`},
{t:"GraphRAG and knowledge graphs",b:`<ul><li><b>Microsoft GraphRAG</b>: LLM extracts entities and relationships into a knowledge graph, clusters it into communities (Leiden algorithm), and writes summaries per community.</li><li><b>Local search</b>: entity-focused questions use the graph neighborhood. <b>Global search</b>: map-reduce over community summaries answers "what are the main themes across all documents?", which vector RAG can't do well.</li><li>Strengths: multi-hop reasoning, relationship questions, corpus-wide summarization.</li><li>Costs: expensive LLM indexing, harder updates. Lighter variants: LightRAG; also Neo4j-based graph + vector hybrids.</li></ul>`},
{t:"RAPTOR and hierarchical summaries",b:`<p><b>RAPTOR</b> recursively clusters chunks, summarizes each cluster, then clusters and summarizes the summaries, building a tree. Retrieval can hit detailed leaves or high-level summaries, helping both specific and broad questions.</p>`},
{t:"Multimodal RAG and structured data",b:`<ul><li><b>Multimodal</b>: retrieve images, charts, slides. Options: caption with a vision model and embed text, multimodal embeddings, or <b>ColPali</b> (embed page images directly, late interaction).</li><li><b>Text-to-SQL</b>: for tabular/numeric questions, generate SQL against a database instead of vector search. Retrieve relevant schema and example queries; validate SQL; use read-only credentials.</li><li><b>Hybrid sources</b>: route between documents, SQL and APIs.</li></ul>`},
{t:"Long context, CAG and memory-augmented RAG",b:`<ul><li><b>Long context vs RAG</b>: for small, static corpora, putting everything in context can be simpler. RAG still wins on cost, latency, freshness, scale, access control and citations.</li><li><b>Cache-Augmented Generation (CAG)</b>: preload a small corpus into the prompt/KV cache once and reuse it for many queries.</li><li><b>Conversational RAG</b>: maintain chat history, condense follow-ups, possibly retrieve from past conversations.</li></ul>`}
]},
{id:"eval",name:"Evaluating RAG",blurb:"How you prove a RAG system works. Interviewers weigh this heavily.",topics:[
{t:"What to evaluate",b:`<p>Evaluate <b>retrieval</b> and <b>generation</b> separately, then end to end. If the answer is wrong, first ask: was the right chunk retrieved? If not, it's a retrieval problem; if yes, it's a generation problem.</p>`,tip:"This 'isolate retrieval from generation' framing is the single most important thing to say about RAG evaluation."},
{t:"Retrieval metrics",b:`<ul><li><b>Hit rate / Recall@k</b>: fraction of queries (or relevant docs) where a relevant chunk appears in the top k.</li><li><b>Precision@k</b>: fraction of the top k that are relevant.</li><li><b>MRR</b> (Mean Reciprocal Rank): average of 1 / rank of the first relevant result. Rank 1 → 1, rank 2 → 0.5.</li><li><b>nDCG@k</b>: position-aware, supports graded relevance; discounts relevant results that appear lower.</li><li><b>MAP</b>: mean of average precision across queries.</li></ul>`},
{t:"Generation metrics (RAGAS and the RAG triad)",b:`<ul><li><b>Faithfulness / groundedness</b>: are all claims in the answer supported by the retrieved context? (catches hallucination)</li><li><b>Answer relevancy</b>: does the answer address the question?</li><li><b>Context precision</b>: are the relevant chunks ranked high, with little noise?</li><li><b>Context recall</b>: does the retrieved context contain everything needed for the reference answer?</li><li><b>Answer correctness</b>: compared to a ground-truth answer.</li></ul><p>The <b>RAG triad</b> (TruLens): context relevance, groundedness, answer relevance. Answering all three with "yes" means no hallucination along the chain.</p>`},
{t:"LLM-as-a-judge",b:`<ul><li>Use a strong LLM with a clear rubric to score outputs (pointwise) or pick the better of two (pairwise).</li><li>Known biases: <b>position bias</b>, <b>verbosity bias</b>, <b>self-preference</b>. Mitigate by swapping order, asking for reasoning first, binary or small scales, and rubrics.</li><li><b>Calibrate</b> against human labels before trusting it.</li></ul>`},
{t:"Building an evaluation dataset",b:`<ul><li>Collect real user queries; get domain experts to write reference answers and mark relevant documents.</li><li>Generate synthetic Q&amp;A pairs from your documents with an LLM, then review a sample.</li><li>Cover easy, hard, multi-hop, ambiguous, and <b>unanswerable</b> questions (the system should say "I don't know").</li><li>Start with 50 to 200 high-quality examples; grow from production failures.</li><li>Run it in CI as a regression test for every prompt, model, chunking or index change.</li></ul>`},
{t:"Tools and online metrics",b:`<ul><li><b>Eval frameworks</b>: RAGAS, DeepEval, TruLens, promptfoo, OpenAI Evals, Braintrust.</li><li><b>Tracing / observability</b>: LangSmith, Langfuse, Arize Phoenix, Weights &amp; Biases Weave, Helicone.</li><li><b>Online metrics</b>: thumbs up/down, follow-up rate, escalation or ticket deflection rate, citation clicks, latency (p50/p95), cost per query, "no answer" rate.</li><li>A/B test changes with real traffic.</li></ul>`}
]},
{id:"fail",name:"RAG failure modes & fixes",blurb:"Debugging stories are interview gold. Know where RAG breaks and how to fix each break.",topics:[
{t:"Seven failure points of RAG",b:`<p>From Barnett et al., <i>Seven Failure Points When Engineering a RAG System</i> (2024):</p><div class="tbl"><table><tr><th>Failure</th><th>Fix</th></tr><tr><td>Missing content: answer isn't in the corpus</td><td>Expand corpus; train the model to say "I don't know"</td></tr><tr><td>Missed top-ranked docs: answer exists but isn't retrieved</td><td>Hybrid search, better embeddings, query rewriting, raise k, reranking</td></tr><tr><td>Not in context: retrieved but cut during consolidation</td><td>Better context budgeting, compression, reranking</td></tr><tr><td>Not extracted: in context but model misses it</td><td>Less noise, better ordering, stronger model, quote-first prompting</td></tr><tr><td>Wrong format</td><td>Structured outputs, examples, validation</td></tr><tr><td>Incorrect specificity: too vague or too detailed</td><td>Prompt for audience and level, query clarification</td></tr><tr><td>Incomplete answer</td><td>Query decomposition, multi-query, iterative retrieval</td></tr></table></div>`},
{t:"Common practical problems",b:`<ul><li><b>Bad parsing</b>: tables mangled, headers mixed in. Fix: layout-aware parsing.</li><li><b>Chunks lacking context</b>: fix with contextual retrieval, title/heading prefixes, parent retrieval.</li><li><b>Exact term misses</b>: add BM25 / hybrid.</li><li><b>Stale or conflicting docs</b>: date metadata, recency boosting, dedup, versioning, source authority ranking.</li><li><b>Follow-up questions fail</b>: condense with chat history.</li><li><b>Numbers and aggregation</b> ("total sales in Q3"): route to SQL or tools, not vector search.</li><li><b>Latency too high</b>: smaller rerankers, caching, fewer chunks, streaming, parallel retrieval.</li><li><b>Permission leaks</b>: ACL filtering at retrieval.</li><li><b>Prompt injection in documents</b>: treat retrieved text as untrusted data.</li></ul>`,tip:"Prepare one real story: symptom → how you diagnosed it (traces, retrieval metrics) → fix → measured improvement."}
]},
{id:"agent",name:"AI agents fundamentals",blurb:"What makes something an agent, its parts, and when to use one instead of a fixed workflow.",topics:[
{t:"What is an AI agent?",b:`<p>An <b>agent</b> is a system where an LLM dynamically directs its own process and tool use, working in a <b>loop</b> toward a goal: it observes, reasons, chooses an action (often a tool call), sees the result, and repeats until done or stopped.</p><div data-explorer="agent"></div>`,tip:"Short definition: 'An LLM using tools in a loop, deciding its own next step based on environment feedback.'"},
{t:"Core components",b:`<ul><li><b>Model (brain)</b>: reasons, plans, chooses actions.</li><li><b>Tools</b>: functions/APIs for search, code execution, databases, email, browsers, other agents.</li><li><b>Memory</b>: short-term (context) and long-term (external stores).</li><li><b>Planning / reasoning</b>: task decomposition, reflection, re-planning.</li><li><b>Orchestration / runtime</b>: the loop, state, retries, timeouts, max steps.</li><li><b>Environment</b>: what the agent acts on and observes.</li><li><b>Guardrails and human-in-the-loop</b>: permissions, approvals, validation.</li></ul>`},
{t:"Workflows vs agents",b:`<p>From Anthropic's <i>Building effective agents</i> (2024):</p><ul><li><b>Workflows</b>: LLMs and tools orchestrated through <b>predefined code paths</b>. Predictable, cheaper, easier to test.</li><li><b>Agents</b>: the LLM <b>decides</b> the steps. Flexible for open-ended tasks, but costlier and less predictable.</li><li>Start with the simplest solution (one well-prompted call with retrieval); add workflows, then agents, only when it measurably helps.</li></ul>`},
{t:"Agentic workflow patterns",b:`<ul><li><b>Augmented LLM</b>: the building block; an LLM with retrieval, tools and memory.</li><li><b>Prompt chaining</b>: fixed sequence of calls with checks between them.</li><li><b>Routing</b>: classify input, send to a specialized prompt or model (cheap model for easy queries).</li><li><b>Parallelization</b>: <i>sectioning</i> (independent subtasks in parallel) or <i>voting</i> (same task several times, aggregate).</li><li><b>Orchestrator-workers</b>: a central LLM breaks the task down dynamically and delegates to workers, then synthesizes.</li><li><b>Evaluator-optimizer</b>: one LLM generates, another critiques, loop until good enough.</li><li><b>Autonomous agent</b>: open-ended loop with tools and environment feedback.</li></ul>`,tip:"Being able to name these patterns and give one use case each is a strong signal."},
{t:"When to use agents (and when not)",b:`<p><b>Good fit</b>: open-ended, multi-step tasks where steps can't be predicted (coding, research, troubleshooting, data analysis), with clear success criteria and feedback, where errors are recoverable.</p><p><b>Poor fit</b>: predictable tasks a workflow handles, strict latency/cost budgets, high-stakes irreversible actions without oversight.</p><p><b>Compounding errors</b>: at 95% per-step reliability, 10 steps succeed only about 0.95¹⁰ ≈ <b>60%</b> of the time. Reduce steps, add verification, and design for recovery.</p>`},
{t:"Autonomy and human-in-the-loop",b:`<ul><li>Spectrum: suggestion only → acts with approval → acts and reports → fully autonomous.</li><li>Require approval for irreversible, costly or external actions (payments, emails, deletions, deployments).</li><li>Interrupt / resume with checkpoints (e.g. LangGraph interrupts).</li><li>Escalate to a human when confidence is low or a policy is hit.</li></ul>`}
]},
{id:"reason",name:"Reasoning & planning patterns",blurb:"Named agent architectures from the research literature that interviewers expect you to know.",topics:[
{t:"ReAct (Reason + Act)",b:`<p>Yao et al., 2022. The model interleaves <b>Thought</b> → <b>Action</b> (tool call) → <b>Observation</b> (tool result), repeating until it gives a final answer. Reasoning guides actions; observations ground reasoning and cut hallucination. The default pattern behind most tool-using agents.</p><p>Weakness: greedy step by step; can loop or drift on long tasks.</p>`},
{t:"Plan-and-Execute, ReWOO and LLMCompiler",b:`<ul><li><b>Plan-and-Execute</b>: a planner writes a multi-step plan up front; an executor runs steps; re-plan when results change things. Better for long tasks; can use a cheaper executor model.</li><li><b>ReWOO</b>: plan all tool calls with variable placeholders (#E1, #E2) without waiting for observations, execute, then solve. Fewer tokens.</li><li><b>LLMCompiler</b>: plan a DAG of tool calls and run independent ones in parallel.</li></ul>`},
{t:"Reflexion and self-critique",b:`<ul><li><b>Reflexion</b> (Shinn 2023): after a failed attempt, the agent writes a verbal reflection on what went wrong and stores it in memory for the next attempt.</li><li><b>Self-Refine</b>: generate → critique → refine in a loop.</li><li><b>Critic / verifier models</b>: separate model checks outputs, runs tests or validates against rules.</li></ul>`},
{t:"Tree of Thoughts and LATS",b:`<ul><li><b>Tree of Thoughts</b>: explore multiple reasoning branches, evaluate them, backtrack (BFS/DFS).</li><li><b>LATS</b> (Language Agent Tree Search): Monte Carlo Tree Search over agent actions with LLM-based value estimates and reflection.</li><li>Powerful but expensive; justified for hard search problems.</li></ul>`},
{t:"Stopping, loops and task decomposition",b:`<ul><li>Define done-criteria explicitly; give the agent a "finish" tool.</li><li>Hard caps: max iterations, max tokens, wall-clock timeouts, budget limits.</li><li>Detect loops (same tool + same arguments repeatedly).</li><li>Decompose big goals into sub-goals; track a to-do list or plan in state.</li></ul>`}
]},
{id:"tools",name:"Tool use, MCP & A2A",blurb:"How models call functions, how to design good tools, and the protocols connecting agents to the world.",topics:[
{t:"How function calling works",b:`<ol><li>You send the model tool definitions: name, description and a JSON Schema for parameters.</li><li>The model decides to call a tool and outputs a structured call (name + JSON arguments).</li><li><b>Your code</b> executes the tool. The model never runs anything itself.</li><li>You return the result to the model as a tool result message.</li><li>The model continues: another call, or a final answer.</li></ol><ul><li><b>Tool choice</b>: auto, required/any, a specific tool, or none.</li><li><b>Parallel tool calls</b>: several independent calls in one turn.</li></ul>`,tip:"Emphasize that the application, not the model, executes tools, which is where you enforce validation and permissions."},
{t:"Designing good tools",b:`<ul><li>Clear, distinct names and detailed descriptions, as if writing docs for a new engineer (the agent-computer interface).</li><li>Fewer, well-scoped, higher-level tools beat many overlapping low-level ones.</li><li>Strict schemas with enums, required fields and examples; make misuse hard ("poka-yoke").</li><li>Return concise, relevant data (not raw dumps); paginate and truncate.</li><li><b>Helpful errors</b>: tell the model what went wrong and how to fix it.</li><li>Idempotent where possible; safe defaults; dry-run modes.</li><li>Least privilege: read-only unless writes are needed.</li><li>Evaluate tools with real tasks and iterate on descriptions.</li></ul>`},
{t:"Model Context Protocol (MCP)",b:`<p><b>MCP</b> is an open protocol introduced by Anthropic (Nov 2024) that standardizes how AI applications connect to external tools and data. Often called "USB-C for AI".</p><ul><li><b>Architecture</b>: a <b>host</b> app (e.g. Claude Desktop, an IDE) runs <b>MCP clients</b>, each connected to an <b>MCP server</b> that exposes capabilities.</li><li><b>Server primitives</b>: <b>tools</b> (functions the model can call), <b>resources</b> (data the app can read), <b>prompts</b> (reusable templates).</li><li><b>Client features</b>: sampling (server asks the host's model for a completion), roots, elicitation (ask the user for input).</li><li><b>Transports</b>: stdio (local) and Streamable HTTP (remote), messages in JSON-RPC 2.0; OAuth for remote auth.</li><li><b>Why it matters</b>: turns the N apps × M integrations problem into N + M; build a server once, use it in any MCP-compatible client. Widely adopted across the industry.</li><li><b>Risks</b>: malicious or compromised servers, tool poisoning, prompt injection through tool outputs, over-broad permissions.</li></ul>`},
{t:"Agent2Agent (A2A) protocol",b:`<p><b>A2A</b>, introduced by Google in 2025 and now under the Linux Foundation, standardizes communication <i>between agents</i> built by different vendors and frameworks.</p><ul><li><b>Agent Card</b>: JSON describing an agent's skills, endpoint and auth.</li><li>Task-based messaging with lifecycle states, streaming and async updates.</li><li><b>MCP vs A2A</b>: MCP connects an agent to tools and data (vertical); A2A connects agents to other agents (horizontal). Complementary.</li></ul>`},
{t:"Code execution, computer use and browser agents",b:`<ul><li><b>Code as action</b>: let the agent write and run Python in a sandbox instead of calling many small tools. Flexible for data analysis (smolagents CodeAgent, code interpreters).</li><li><b>Computer use</b>: the model sees screenshots and controls mouse and keyboard.</li><li><b>Browser agents</b>: navigate and fill forms on the web.</li><li>Always sandbox (containers, no secrets, network limits) and require approval for sensitive actions.</li></ul>`}
]},
{id:"mem",name:"Agent memory",blurb:"How agents remember within a task and across sessions.",topics:[
{t:"Short-term memory",b:`<p>The current context window: conversation turns, tool calls and results, scratchpad. Managed by trimming old turns, sliding windows, summarizing (compaction), and dropping or shortening large tool outputs. In frameworks it's the <b>state</b> object, often checkpointed so a run can pause and resume.</p>`},
{t:"Long-term memory",b:`<p>Persisted outside the model and retrieved when relevant, across sessions.</p><ul><li><b>Episodic</b>: specific past events and interactions ("last week the user asked about X").</li><li><b>Semantic</b>: facts and preferences ("user prefers Python", "company uses AWS").</li><li><b>Procedural</b>: how to do things; learned instructions, updated system prompts, skills.</li></ul><p>Storage: vector stores, key-value stores, knowledge graphs, files.</p>`},
{t:"Memory management",b:`<ul><li><b>What to write</b>: extract salient facts with an LLM rather than storing everything.</li><li><b>When</b>: in the hot path (immediately) or in the background after the conversation.</li><li><b>Updating</b>: handle contradictions and stale facts (overwrite, timestamp, decay).</li><li><b>Retrieval</b>: by similarity, recency and importance.</li><li><b>Privacy</b>: user control, deletion, no sensitive data without consent.</li><li>Tools: <b>MemGPT / Letta</b> (OS-style paging between context and external memory), Mem0, Zep, LangGraph memory store.</li></ul>`}
]},
{id:"multi",name:"Multi-agent systems",blurb:"Several agents working together: architectures, benefits and the costs people forget.",topics:[
{t:"Why multi-agent?",b:`<ul><li><b>Specialization</b>: each agent has focused instructions and tools.</li><li><b>Parallelism</b>: explore independent subtasks at once (e.g. research subtopics).</li><li><b>Context isolation</b>: each sub-agent gets a clean context window and returns a condensed result.</li></ul><p><b>Costs</b>: many more tokens (multi-agent research systems can use several times the tokens of a single chat), coordination overhead, harder debugging, error propagation. Use only when the task is valuable and parallelizable.</p>`},
{t:"Architectures",b:`<ul><li><b>Supervisor / orchestrator-worker</b>: a lead agent plans, delegates to sub-agents, synthesizes. Most common.</li><li><b>Hierarchical</b>: supervisors of supervisors for large systems.</li><li><b>Sequential pipeline</b>: agent A → B → C (researcher → writer → editor).</li><li><b>Network / peer-to-peer</b>: any agent can talk to any other.</li><li><b>Handoffs / swarm</b>: the active agent transfers control to another specialist (triage → billing agent).</li><li><b>Debate</b>: agents argue; a judge decides. Improves reasoning on some tasks.</li><li><b>Blackboard</b>: agents read and write a shared workspace.</li></ul>`},
{t:"Challenges",b:`<ul><li>Clear task delegation: sub-agents need objective, output format, tool guidance and boundaries.</li><li>Shared state and consistency.</li><li>Infinite loops and runaway costs: budgets and step limits.</li><li>Errors compound across agents; add verification.</li><li>Evaluation and tracing across many agents.</li></ul>`}
]},
{id:"fw",name:"Frameworks & tooling",blurb:"The ecosystem you'll be asked about. Know what each is for, not every API.",topics:[
{t:"Agent and LLM frameworks",b:`<div class="tbl"><table><tr><th>Framework</th><th>What it's known for</th></tr><tr><td>LangChain</td><td>Broad building blocks: models, prompts, retrievers, tools, integrations</td></tr><tr><td>LangGraph</td><td>Stateful agents as graphs: nodes, edges, cycles, checkpoints, human-in-the-loop, streaming</td></tr><tr><td>LlamaIndex</td><td>Data and RAG focus: loaders, indexes, query engines, agents, workflows</td></tr><tr><td>Haystack</td><td>Production NLP / RAG pipelines (deepset)</td></tr><tr><td>CrewAI</td><td>Role-based multi-agent "crews" with tasks</td></tr><tr><td>AutoGen / AG2</td><td>Microsoft's conversational multi-agent framework</td></tr><tr><td>Semantic Kernel</td><td>Microsoft SDK for enterprise apps (C#, Python, Java)</td></tr><tr><td>OpenAI Agents SDK</td><td>Lightweight agents, handoffs, guardrails, tracing</td></tr><tr><td>Claude Agent SDK</td><td>Anthropic's agent harness (the engine behind Claude Code)</td></tr><tr><td>Google ADK</td><td>Google's Agent Development Kit</td></tr><tr><td>Pydantic AI</td><td>Type-safe agents with Pydantic validation</td></tr><tr><td>smolagents</td><td>Hugging Face; minimal code-writing agents</td></tr><tr><td>DSPy</td><td>Program LMs declaratively; auto-optimize prompts</td></tr></table></div>`,tip:"A mature answer: 'Frameworks speed up prototyping, but I keep the core loop simple and understand what they do underneath; sometimes the raw API is clearer.'"},
{t:"Supporting stack",b:`<ul><li><b>Model providers</b>: Anthropic, OpenAI, Google, Mistral, Cohere; clouds: AWS Bedrock, Azure AI Foundry, Google Vertex AI.</li><li><b>Open models / hosting</b>: Hugging Face, Ollama, vLLM, Together, Fireworks, Groq.</li><li><b>Observability</b>: LangSmith, Langfuse, Arize Phoenix, Helicone, OpenTelemetry.</li><li><b>Evaluation</b>: RAGAS, DeepEval, promptfoo, Braintrust.</li><li><b>Guardrails</b>: Guardrails AI, NeMo Guardrails, Llama Guard.</li><li><b>Gateways</b>: LiteLLM, Portkey (unified API, fallbacks, routing).</li></ul>`}
]},
{id:"agenteval",name:"Agent evaluation & reliability",blurb:"Agents are hard to test. Know the metrics, benchmarks and production safeguards.",topics:[
{t:"What to measure",b:`<ul><li><b>Task success rate</b> (final outcome correct).</li><li><b>Trajectory evaluation</b>: were the right tools called, in a sensible order, with correct arguments?</li><li><b>Tool-call accuracy</b> and argument validity.</li><li><b>Efficiency</b>: steps, tokens, cost, latency.</li><li><b>Consistency</b>: pass@k (succeeds at least once in k tries) vs <b>pass^k</b> (succeeds every time in k tries); production needs the latter.</li><li><b>Safety</b>: policy violations, unauthorized actions.</li></ul><p>Grade outcomes with code checks where possible (tests pass, database state correct), LLM judges for open-ended outputs, and human review for calibration.</p>`},
{t:"Benchmarks to know",b:`<ul><li><b>SWE-bench / SWE-bench Verified</b>: fix real GitHub issues.</li><li><b>Terminal-Bench</b>: tasks in a command-line environment.</li><li><b>GAIA</b>: general assistant questions needing tools and web.</li><li><b>WebArena</b>, <b>OSWorld</b>: web and computer-use tasks.</li><li><b>τ-bench (tau-bench)</b>: customer service agents with tools and policies; measures pass^k.</li><li><b>BFCL</b> (Berkeley Function Calling Leaderboard): tool-calling accuracy.</li><li><b>AgentBench</b>: multi-environment agent benchmark.</li></ul>`},
{t:"Making agents reliable in production",b:`<ul><li>Prefer deterministic workflows for known paths; agentic loops only where needed.</li><li>Validate tool inputs and outputs; schema checks.</li><li>Retries with exponential backoff; timeouts; fallback models.</li><li>Step, token and cost budgets.</li><li>Checkpointing and resumability for long tasks.</li><li>Human approval for risky actions.</li><li>Full tracing of every LLM call and tool call; replay failures.</li><li>Eval suites in CI; monitor drift in production.</li></ul>`}
]},
{id:"ft",name:"Fine-tuning & alignment",blurb:"When and how to adapt models. Expect at least one LoRA or RLHF question.",topics:[
{t:"When to fine-tune",b:`<ul><li>Consistent style, tone or output format.</li><li>Domain-specific language or narrow classification/extraction tasks.</li><li>Distilling a big model's behavior into a smaller, cheaper, faster one.</li><li>Shorter prompts (behavior baked in).</li></ul><p><b>Not</b> the first choice for adding frequently changing knowledge (use RAG). Try prompting and RAG first; fine-tune when you have good data and a clear metric.</p>`},
{t:"Full fine-tuning vs PEFT, LoRA and QLoRA",b:`<ul><li><b>Full fine-tuning</b>: update all weights. Expensive, needs lots of GPU memory, risk of catastrophic forgetting.</li><li><b>PEFT</b> (parameter-efficient fine-tuning): train a small number of extra parameters.</li><li><b>LoRA</b>: freeze base weights W; learn a low-rank update ΔW = B·A (rank r, e.g. 8 to 64, scaled by alpha). Trains under 1% of parameters; adapters are small, swappable and can be merged into the base model.</li><li><b>QLoRA</b>: load the base model in 4-bit (NF4) quantization and train LoRA adapters on top, so large models fine-tune on a single GPU.</li><li>Others: adapters, prefix tuning, prompt tuning, DoRA.</li><li>Tools: Hugging Face PEFT/TRL, Unsloth, Axolotl, provider fine-tuning APIs.</li></ul>`},
{t:"Alignment methods",b:`<ul><li><b>SFT</b>: supervised training on demonstration pairs.</li><li><b>RLHF</b>: collect human preference rankings → train a reward model → optimize the policy with PPO, with a KL penalty to stay close to the original.</li><li><b>DPO</b>: directly optimizes on chosen/rejected pairs with a classification-style loss; no reward model or RL loop; simpler and stable.</li><li><b>ORPO, KTO, SimPO</b>: further simplifications.</li><li><b>RLAIF / Constitutional AI</b>: AI-generated feedback guided by a written set of principles.</li><li><b>GRPO</b>: RL that compares a group of sampled answers to each other instead of using a value model; popular for reasoning with verifiable rewards.</li></ul>`},
{t:"Data and pitfalls",b:`<ul><li>Quality beats quantity: a few hundred to a few thousand clean examples can work.</li><li>Hold out a test set; compare to a prompted baseline.</li><li><b>Catastrophic forgetting</b>: the model loses general skills. Mix in general data, use LoRA, lower learning rate.</li><li>Overfitting, data leakage, and privacy of training data.</li><li><b>Distillation</b>: generate training data from a strong teacher model to train a small student.</li></ul>`}
]},
{id:"ops",name:"Production & LLMOps",blurb:"Latency, cost, serving, caching and monitoring. This is where senior candidates stand out.",topics:[
{t:"Latency",b:`<ul><li><b>TTFT</b> (time to first token) and <b>tokens per second</b>; total latency ≈ TTFT + output tokens / speed.</li><li><b>Stream</b> responses so users see progress.</li><li>Use smaller/faster models for simple steps; route hard queries to big models.</li><li>Parallelize independent retrievals and tool calls.</li><li>Cache embeddings, retrieval results, answers and prompt prefixes.</li><li>Shorter outputs (output tokens are the slow part).</li></ul>`},
{t:"Cost optimization",b:`<ul><li>Input and output tokens are priced separately; output is usually pricier.</li><li><b>Model routing / cascades</b>: cheap model first, escalate if needed.</li><li>Prompt caching; semantic caching; batch APIs for offline jobs (often around half price).</li><li>Trim context: fewer, better chunks; compress history.</li><li>Fine-tune or distill a smaller model for high-volume narrow tasks.</li><li>Track cost per request, per user, per feature.</li></ul>`},
{t:"Serving open models",b:`<ul><li><b>vLLM</b>: high-throughput serving with <b>PagedAttention</b> (KV cache paged like virtual memory) and continuous batching.</li><li>Also: Hugging Face TGI, NVIDIA TensorRT-LLM / Triton, SGLang, llama.cpp and Ollama for local use.</li><li><b>Continuous batching</b>: add and remove requests from a running batch each step for better GPU use.</li><li>Quantization, speculative decoding, tensor/pipeline parallelism across GPUs.</li></ul>`},
{t:"Caching strategies",b:`<ul><li><b>Exact cache</b>: same input → same output.</li><li><b>Semantic cache</b>: embed the query; if a past query is similar enough, return its cached answer (e.g. GPTCache, Redis). Risk: wrong answer for subtly different questions; tune thresholds.</li><li><b>Prompt / prefix cache</b>: provider-side reuse of the shared prompt prefix.</li><li><b>Embedding cache</b>: don't re-embed unchanged chunks.</li></ul>`},
{t:"Observability and monitoring",b:`<ul><li>Trace every request: spans for retrieval, reranking, each LLM call and tool call, with inputs, outputs, tokens, latency and cost.</li><li>Log retrieved chunk IDs to debug answers.</li><li>Monitor quality (online evals, user feedback), latency percentiles, error rates, cost, drift in query types.</li><li>Tools: LangSmith, Langfuse, Arize Phoenix, Helicone, Datadog, OpenTelemetry GenAI conventions.</li></ul>`},
