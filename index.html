  model: "claude-sonnet-5-5",
  max_tokens: 500,
  messages: [{ role: "user", content: "Explain RAG in two sentences." }],
});
console.log(msg.content[0].text);
`,"JavaScript")}`},
{t:"Python & JavaScript SDKs at a glance",b:`<div class="tbl"><table><tr><th></th><th>Python (<code>anthropic</code>)</th><th>JS/TS (<code>@anthropic-ai/sdk</code>)</th></tr>
<tr><td>Client</td><td><code>Anthropic()</code>, <code>AsyncAnthropic()</code></td><td><code>new Anthropic()</code> (async by default)</td></tr>
<tr><td>Create</td><td><code>client.messages.create(...)</code></td><td><code>await client.messages.create({...})</code></td></tr>
<tr><td>Stream</td><td><code>with client.messages.stream(...) as s</code></td><td><code>client.messages.stream({...}).on("text", fn)</code></td></tr>
<tr><td>Errors</td><td><code>anthropic.RateLimitError</code>, <code>APIStatusError</code>…</td><td><code>Anthropic.RateLimitError</code>, <code>Anthropic.APIError</code>…</td></tr>
<tr><td>Types</td><td>Pydantic models</td><td>Full TypeScript types</td></tr></table></div>
<p>Other official SDKs exist (Java, Go, C#, Ruby, PHP). Both SDKs retry transient errors automatically and support timeouts.</p>${GO("s7","SDKs in depth")}`}
]},
{id:"s3",step:3,level:"Basic",name:"Messages API essentials",blurb:"The one endpoint behind every Claude app: request shape, roles, parameters, streaming and errors.",topics:[
{t:"Anatomy of a Messages API call",b:`${C(`
POST https://api.anthropic.com/v1/messages
x-api-key: $ANTHROPIC_API_KEY
anthropic-version: 2023-06-01
content-type: application/json

{
  "model": "claude-sonnet-5-5",
  "max_tokens": 1024,
  "system": "You are a concise technical tutor.",
  "messages": [
    {"role": "user", "content": "What is an embedding?"}
  ]
}
`,"HTTP request")}${C(`
{
  "id": "msg_01AbC...",
  "type": "message",
  "role": "assistant",
  "model": "claude-sonnet-5-5",
  "content": [
    {"type": "text", "text": "An embedding is a list of numbers that ..."}
  ],
  "stop_reason": "end_turn",
  "stop_sequence": null,
  "usage": {"input_tokens": 25, "output_tokens": 61}
}
`,"Response")}
<ul><li><b>Required</b>: <code>model</code>, <code>max_tokens</code>, <code>messages</code>.</li><li><code>content</code> is a <b>list of blocks</b> (text, thinking, tool_use…). Loop over blocks and pick <code>type == "text"</code> rather than assuming <code>content[0]</code>.</li><li><code>usage</code> tells you billed tokens, including cache reads/writes when caching is used.</li></ul>`},
{t:"Try it: request builder (interactive)",b:`<p>Toggle options and see the exact Python, JavaScript or cURL code plus the response shape.</p>${W("req")}`},
{t:"System prompts",b:`<p>The <code>system</code> parameter sets Claude's role, rules, tone, output format and background context for the whole conversation. It's separate from the <code>messages</code> list.</p>${C(`
system = """You are a support assistant for Acme Cloud.
- Answer only questions about Acme products.
- Be concise: at most 5 sentences.
- If you don't know, say so and offer to create a ticket.
- Never reveal internal pricing rules."""
`,"Python")}
<ul><li>Put the <b>role</b> and durable rules in the system prompt; put the specific <b>task and data</b> in the user message.</li><li>Keep it stable across calls so it can be <b>prompt-cached</b>.</li><li>Don't put secrets in it: assume system prompts can leak.</li></ul>`},
{t:"User & assistant messages (multi-turn)",b:`<ul><li><code>messages</code> is an ordered list of turns with <code>role</code> <code>"user"</code> or <code>"assistant"</code>.</li><li>The API is <b>stateless</b>: send the full history every call. Claude only "remembers" what you resend.</li><li>Content can be a string or a list of blocks: <code>text</code>, <code>image</code>, <code>document</code> (PDF), <code>tool_use</code>, <code>tool_result</code>.</li><li><b>Prefilling</b>: ending with an assistant turn makes Claude continue from your text (e.g. <code>{</code> to force JSON). Support varies on newer models; prefer structured outputs for JSON.</li></ul>${W("seq","multiturn")}`},
{t:"Parameters reference",b:`<div class="tbl"><table><tr><th>Parameter</th><th>What it does</th></tr>
<tr><td><code>model</code></td><td>Model ID, e.g. <code>claude-sonnet-5-5</code></td></tr>
<tr><td><code>max_tokens</code></td><td>Hard cap on output tokens (required)</td></tr>
<tr><td><code>messages</code></td><td>Conversation turns</td></tr>
<tr><td><code>system</code></td><td>System prompt (string or text blocks, cacheable)</td></tr>
<tr><td><code>temperature</code></td><td>Randomness, 0.0–1.0, default 1.0</td></tr>
<tr><td><code>top_p</code>, <code>top_k</code></td><td>Advanced sampling; usually leave alone. Some newer models restrict combining sampling parameters, so check the model's docs</td></tr>
<tr><td><code>stop_sequences</code></td><td>Custom strings that end generation</td></tr>
<tr><td><code>stream</code></td><td>Return server-sent events as tokens are generated</td></tr>
<tr><td><code>tools</code>, <code>tool_choice</code></td><td>Tool definitions and whether/which tool Claude must use</td></tr>
<tr><td><code>output_config</code></td><td>Structured output format (JSON schema) and related settings</td></tr>
<tr><td><code>thinking</code> / effort settings</td><td>Control reasoning depth on models with extended or adaptive thinking</td></tr>
<tr><td><code>metadata.user_id</code></td><td>Opaque end-user ID for abuse detection</td></tr></table></div>`},
{t:"Temperature (interactive)",b:`<p>Temperature reshapes the probability distribution before sampling. Claude accepts 0.0–1.0 (default 1.0).</p>${W("temp")}
<ul><li><b>0.0–0.3</b>: extraction, classification, RAG answers, code.</li><li><b>0.5–0.8</b>: general writing.</li><li><b>~1.0</b>: brainstorming, creative variety.</li><li>Even at 0, outputs aren't guaranteed identical every time.</li></ul>${GO("llm","decoding parameters")}`},
{t:"Max tokens & stop reasons",b:`<p><code>max_tokens</code> caps the output only (input is limited by the context window). If Claude hits it mid-answer, the response is cut off and <code>stop_reason</code> is <code>"max_tokens"</code>.</p>
<div class="tbl"><table><tr><th>stop_reason</th><th>Meaning</th><th>What your code does</th></tr>
<tr><td><code>end_turn</code></td><td>Claude finished naturally</td><td>Use the answer</td></tr>
<tr><td><code>max_tokens</code></td><td>Hit the output cap</td><td>Raise the cap, ask for shorter output, or continue in a new turn</td></tr>
<tr><td><code>stop_sequence</code></td><td>Hit one of your stop sequences</td><td>Check <code>stop_sequence</code> field</td></tr>
<tr><td><code>tool_use</code></td><td>Claude wants to call a tool</td><td>Run the tool, send back <code>tool_result</code></td></tr>
<tr><td><code>pause_turn</code></td><td>A long server-tool turn was paused</td><td>Send the response back to let Claude continue</td></tr>
<tr><td><code>refusal</code></td><td>Claude declined for safety reasons</td><td>Handle gracefully; don't blindly retry</td></tr></table></div>`,tip:"Always check stop_reason in production; silently truncated answers from max_tokens are a classic bug."},
{t:"Streaming responses (sequence diagram)",b:`<p>With <code>stream: true</code> the API sends <b>server-sent events (SSE)</b> as tokens are generated, so users see text immediately (lower perceived latency). Streaming is also recommended for long outputs to avoid HTTP timeouts.</p>${W("seq","stream")}
${C(`
with client.messages.stream(
    model="claude-sonnet-5-5",
    max_tokens=1024,
    messages=[{"role": "user", "content": "Explain vector search."}],
) as stream:
    for text in stream.text_stream:
        print(text, end="", flush=True)
    final = stream.get_final_message()   # full message + usage
`,"Python")}`},
{t:"Error handling (interactive)",b:`<p>Tap a status code to see what it means and whether to retry.</p>${W("errors")}${W("flow","errorflow")}
${C(`
import anthropic

client = anthropic.Anthropic(max_retries=3, timeout=60.0)

try:
    msg = client.messages.create(model="claude-sonnet-5-5", max_tokens=512,
                                 messages=[{"role": "user", "content": "Hi"}])
except anthropic.RateLimitError:
    ...                        # 429: back off, queue, or degrade gracefully
except anthropic.APIStatusError as e:
    print(e.status_code, e.response.headers.get("request-id"))
except anthropic.APIConnectionError:
    ...                        # network failure (already retried by the SDK)
`,"Python")}
<p>The SDKs automatically retry connection errors, 408, 409, 429 and 5xx responses (2 retries by default) with exponential backoff. Log the <code>request-id</code> header for support tickets.</p>`,tip:"Know which errors are retryable: 429, 500, 529 and timeouts yes; 400, 401, 403, 404 and 413 no."}
]},
{id:"s4",step:4,level:"Basic",name:"Prompting fundamentals",blurb:"Zero-, one- and few-shot prompting, roles, templates and the habits that make prompts reliable.",topics:[
{t:"Zero-shot, one-shot and few-shot",b:`<ul><li><b>Zero-shot</b>: instruction only. Fine for common tasks.</li><li><b>One-shot</b>: one example shows the format.</li><li><b>Few-shot</b>: 3–5 diverse examples teach format, tone and edge cases (in-context learning). Wrap them in tags so Claude doesn't confuse examples with the real input.</li></ul>${C(`
Classify the review's sentiment as positive, negative, or mixed.
Reply with the label only.

<examples>
<example>
<review>Fast shipping, but the case cracked within a week.</review>
<sentiment>mixed</sentiment>
</example>
<example>
<review>Exactly as described. Works perfectly.</review>
<sentiment>positive</sentiment>
</example>
<example>
<review>Support never answered my emails.</review>
<sentiment>negative</sentiment>
</example>
</examples>

<review>{{REVIEW}}</review>
`,"Prompt")}<p><b>Tips</b>: make examples varied and representative, include tricky cases, and keep them consistent with your instructions. Too-similar examples cause Claude to copy surface details.</p>`},
{t:"Role prompting",b:`<p>Giving Claude a role in the system prompt focuses its knowledge, vocabulary and tone.</p>${C(`
system = "You are a senior financial analyst at a public company. " \\
         "You explain risks plainly to non-finance executives."
`,"Python")}<p>Be specific: "a pediatric nurse explaining to worried parents" beats "a helpful assistant". Combine the role with the audience and the goal.</p>`},
{t:"Prompt templates",b:`<p>Templates separate the fixed instructions from variable inputs, so prompts can be versioned, tested and reused. The console uses <code>{{VARIABLE}}</code> placeholders.</p>${C(`
TEMPLATE = """You are reviewing a contract for {company}.

<contract>
{contract}
</contract>

List every clause about termination. For each, quote it and explain it in one sentence."""

prompt = TEMPLATE.format(company="Acme Ltd", contract=contract_text)
`,"Python")}<ul><li>Store templates in files or a prompt registry with version numbers.</li><li>Validate and escape user inputs; put them inside tags.</li><li>Test every template change against an eval set.</li></ul>`},
{t:"Prompt best practices (interactive prompt lab)",b:`<p>Anthropic's core guidance:</p><ol><li><b>Be clear, direct and detailed</b>: context, audience, goal, success criteria. Golden rule: would a smart new colleague understand it?</li><li><b>Use examples</b> (multishot).</li><li><b>Let Claude think</b> before answering for complex tasks.</li><li><b>Use XML tags</b> to separate instructions, data and examples.</li><li><b>Give Claude a role</b> via the system prompt.</li><li><b>Control the output format</b>: say what to do (not only what not to do); use structured outputs for JSON.</li><li><b>Chain prompts</b> for multi-step work.</li><li><b>Long-context tips</b>: documents first, question last.</li></ol>${W("promptlab")}`}
]},
{id:"s5",step:5,level:"Intermediate",name:"Advanced prompting with Claude",blurb:"XML structure, chaining, context management, long documents and reducing hallucinations.",topics:[
{t:"XML prompting",b:`<p>Claude is trained to pay attention to XML-style tags. Tags make prompts clearer, reduce mix-ups between instructions and data, and make output easy to parse.</p>${C(`
<instructions>
Summarize the report for the board. Use the style guide.
</instructions>

<style_guide>
Plain English. No jargon. Max 150 words.
</style_guide>

<report>
{{REPORT}}
</report>

Write your summary inside <summary> tags.
`,"Prompt")}<ul><li>No special tag names are required; be consistent and refer to them by name ("using the report in &lt;report&gt; tags").</li><li>Nest tags for hierarchy (<code>&lt;documents&gt;&lt;document&gt;</code>).</li><li>Ask for output in tags, then extract with a regex or parser.</li><li>Tags also help against prompt injection: untrusted data stays clearly labelled.</li></ul>`},
{t:"Prompt chaining (flowchart)",b:`<p>Break complex tasks into a sequence of focused calls. Each step is easier to get right, test and debug, and you can add programmatic checks between steps.</p>${W("flow","promptchain")}<p>Variations: <b>parallel chains</b> (independent subtasks at once) and <b>self-correction chains</b> (generate → review → refine).</p>`},
{t:"Context management",b:`<ul><li><b>Decide what goes in</b>: instructions, only the relevant documents, the needed history, tool definitions.</li><li><b>Trim and summarize</b> old conversation turns; drop bulky old tool results.</li><li><b>Count tokens</b> before sending to avoid limit errors.</li><li><b>Prompt caching</b>: mark a stable prefix (system prompt, big documents, tool definitions) with <code>cache_control</code>. Later calls with the same prefix read it from cache: faster and much cheaper input.</li></ul>${C(`
msg = client.messages.create(
    model="claude-sonnet-5-5",
    max_tokens=1024,
    system=[
        {"type": "text", "text": "You answer questions about the employee handbook."},
        {"type": "text", "text": HANDBOOK_TEXT,
         "cache_control": {"type": "ephemeral"}},     # cache everything up to here
    ],
    messages=[{"role": "user", "content": question}],
)
print(msg.usage.cache_creation_input_tokens, msg.usage.cache_read_input_tokens)

n = client.messages.count_tokens(
    model="claude-sonnet-5-5",
    messages=[{"role": "user", "content": question}],
).input_tokens
`,"Python")}<p>Cache entries live for a short time (5 minutes by default, refreshed on use, with a longer option). Cache reads are billed at a small fraction of normal input price; writes cost slightly more. A minimum prefix length applies.</p>`},
{t:"Long-context prompts",b:`<ul><li><b>Put long documents at the top</b>, above instructions and the question. Putting the query at the end noticeably improves answers on long inputs.</li><li>Wrap each document with metadata.</li><li><b>Ask Claude to quote relevant passages first</b>, then answer from those quotes. This cuts through noise.</li></ul>${C(`
<documents>
  <document index="1">
    <source>annual_report_2025.pdf</source>
    <document_content>{{ANNUAL_REPORT}}</document_content>
  </document>
  <document index="2">
    <source>competitor_analysis.xlsx</source>
    <document_content>{{COMPETITOR_ANALYSIS}}</document_content>
  </document>
</documents>

First find quotes relevant to the question and put them in <quotes> tags.
Then answer in <answer> tags, citing document indexes.

Question: {{QUESTION}}
`,"Prompt")}`},
{t:"Hallucination reduction",b:`<p>Techniques recommended for Claude:</p><ol><li><b>Allow "I don't know"</b> explicitly.</li><li><b>Ground in sources</b>: answer only from provided documents (RAG).</li><li><b>Quote first</b>: extract exact quotes, then answer from them.</li><li><b>Require citations</b>, and tell Claude to retract any claim it can't support with a quote.</li><li><b>Let Claude think</b> step by step, and use a verification pass.</li><li><b>Best-of-N</b>: sample several times; disagreement signals possible hallucination.</li><li><b>Use tools</b> (search, calculator, database) for facts and math.</li><li>Lower temperature for factual tasks.</li></ol>
<p><b>Citations feature</b>: pass documents as content blocks with citations enabled, and Claude's answer comes back with pointers to the exact cited passages.</p>${C(`
messages = [{"role": "user", "content": [
    {"type": "document",
     "source": {"type": "text", "media_type": "text/plain", "data": policy_text},
     "title": "Leave policy",
     "citations": {"enabled": True}},
    {"type": "text", "text": "How many days of parental leave do employees get?"},
]}]
`,"Python")}`},
{t:"Extended & adaptive thinking",b:`<p>Current Claude models can reason before answering. Thinking appears as <code>thinking</code> content blocks before the final text. Newer models use <b>adaptive thinking</b>, deciding how much to think per step, steered by an <b>effort</b> setting.</p><ul><li>Higher effort: better on math, coding, planning and agent tasks; more tokens and latency.</li><li>Lower effort: faster and cheaper for simple tasks.</li><li>Thinking tokens are billed as output and count toward the context window.</li><li>Prefer high-level instructions ("think carefully about edge cases") over scripting each reasoning step.</li></ul>`}
]},
{id:"s6",step:6,level:"Intermediate",name:"Structured outputs & tool calling",blurb:"Getting reliable JSON, validating it, and letting Claude call your functions and external APIs.",topics:[
{t:"JSON outputs (structured outputs)",b:`<p>Structured outputs use <b>constrained decoding</b> so Claude's response is guaranteed to be valid JSON matching your schema: no parse errors, no missing required fields.</p>${C(`
import json

schema = {
    "type": "object",
    "properties": {
        "name":  {"type": "string"},
        "email": {"type": "string"},
        "plan":  {"type": "string", "enum": ["free", "pro", "enterprise"]},
    },
    "required": ["name", "email", "plan"],
    "additionalProperties": False,
}

msg = client.messages.create(
    model="claude-sonnet-5-5",
    max_tokens=1024,
    messages=[{"role": "user", "content": "Extract the customer: " + email_text}],
    output_config={"format": {"type": "json_schema", "schema": schema}},
)
text = next(b.text for b in msg.content if b.type == "text")
customer = json.loads(text)
`,"Python")}<ul><li>SDK helpers accept Pydantic (Python) or Zod (TypeScript) models directly and return parsed objects.</li><li>For tools, set <code>"strict": true</code> on a tool definition to guarantee valid tool inputs.</li><li>Older approaches you should still know: instructions + examples, prefilling <code>{</code>, or a "fake tool" whose schema is your output format.</li></ul>`},
{t:"JSON Schema essentials",b:`${C(`
{
  "type": "object",
  "description": "An invoice extracted from a PDF",
  "properties": {
    "invoice_id": {"type": "string"},
    "date":       {"type": "string", "description": "ISO 8601, e.g. 2026-03-01"},
    "total":      {"type": "number"},
    "currency":   {"type": "string", "enum": ["USD", "EUR", "INR"]},
    "line_items": {
      "type": "array",
      "items": {
        "type": "object",
        "properties": {
          "description": {"type": "string"},
          "quantity":    {"type": "integer"},
          "unit_price":  {"type": "number"}
        },
        "required": ["description", "quantity", "unit_price"],
        "additionalProperties": false
      }
    }
  },
  "required": ["invoice_id", "total", "currency", "line_items"],
  "additionalProperties": false
}
`,"JSON Schema")}<ul><li>Types: string, number, integer, boolean, array, object, null.</li><li><code>required</code>, <code>enum</code>, <code>items</code>, nested objects, <code>description</code> (Claude reads these).</li><li><code>additionalProperties: false</code> blocks unexpected keys.</li><li>Structured outputs support most but not every JSON Schema feature; check the limitations list.</li></ul>`},
{t:"Response validation",b:`<p>Valid JSON isn't the same as correct data. Validate types <i>and</i> business rules, then retry with the error message if needed.</p>${C(`
from pydantic import BaseModel, ValidationError, field_validator

class Invoice(BaseModel):
    invoice_id: str
    total: float
    currency: str

    @field_validator("total")
    @classmethod
    def positive(cls, v):
        if v <= 0:
            raise ValueError("total must be positive")
        return v

def extract(text, attempts=3):
    messages = [{"role": "user", "content": "Extract the invoice as JSON: " + text}]
    for _ in range(attempts):
        msg = client.messages.create(model="claude-sonnet-5-5", max_tokens=1024,
                                     messages=messages)
        raw = next(b.text for b in msg.content if b.type == "text")
        try:
            return Invoice.model_validate_json(raw)
        except ValidationError as e:
            messages += [{"role": "assistant", "content": raw},
                         {"role": "user", "content": "Fix these errors and return only JSON: " + str(e)}]
    raise RuntimeError("Could not extract a valid invoice")
`,"Python")}<p>Also check: cross-field consistency (line items sum to total), allowed ranges, and that extracted values actually appear in the source (anti-hallucination).</p>`},
{t:"Function / tool calling (sequence diagram)",b:`<p>Step through the full round trip:</p>${W("seq","tooluse")}${C(`
import json

tools = [{
    "name": "get_weather",
    "description": "Get current weather for a city. Use when the user asks about weather.",
    "input_schema": {
        "type": "object",
        "properties": {"city": {"type": "string", "description": "City name, e.g. Paris"}},
        "required": ["city"],
    },
}]

messages = [{"role": "user", "content": "Should I take an umbrella in Paris today?"}]

for _ in range(10):                                  # safety cap on the loop
    resp = client.messages.create(model="claude-sonnet-5-5", max_tokens=1024,
                                  tools=tools, messages=messages)
    messages.append({"role": "assistant", "content": resp.content})
    if resp.stop_reason != "tool_use":
        break
    results = []
    for block in resp.content:
        if block.type == "tool_use":
            try:
                output = run_tool(block.name, block.input)       # your code
                results.append({"type": "tool_result", "tool_use_id": block.id,
                                "content": json.dumps(output)})
            except Exception as e:
                results.append({"type": "tool_result", "tool_use_id": block.id,
                                "content": f"Error: {e}", "is_error": True})
    messages.append({"role": "user", "content": results})

print(next(b.text for b in resp.content if b.type == "text"))
`,"Python")}
<ul><li><b>tool_choice</b>: <code>auto</code> (default), <code>any</code> (must use some tool), <code>tool</code> (a specific one), <code>none</code>.</li><li><b>Parallel tool use</b>: Claude can request several tools in one turn; return all results in one user message.</li><li><b>Client tools</b> run in your code; <b>server tools</b> (web search, web fetch, code execution) run on Anthropic's side.</li><li>Tool results go in a <b>user</b> message and must reference the matching <code>tool_use_id</code>.</li></ul>`,tip:"Say clearly: Claude never executes anything itself. It requests a call; your code validates, executes and returns the result."},
{t:"External API integration",b:`<p>Most tools wrap an external API (CRM, weather, payments, internal services).</p><ul><li>Keep API credentials in your backend; Claude only sees tool names and results.</li><li>Validate Claude's tool input against the schema and business rules before calling.</li><li>Set timeouts, retries and rate limits per external API.</li><li>Return concise, relevant fields (not a 5MB JSON dump); paginate.</li><li>Return errors as <code>is_error: true</code> with a helpful message so Claude can recover.</li><li>Require human confirmation for side effects (payments, emails, deletes).</li><li>Make write operations idempotent (idempotency keys).</li></ul>${C(`
import httpx

def get_weather(city: str) -> dict:
    r = httpx.get("https://api.example-weather.com/v1/current",
                  params={"q": city, "key": WEATHER_KEY}, timeout=5.0)
    r.raise_for_status()
    data = r.json()
    return {"city": city, "temp_c": data["temp_c"], "rain_chance": data["rain_pct"]}
`,"Python")}${GO("tools","tool design best practices")}`}
]},
{id:"s7",step:7,level:"Intermediate",name:"Python & JavaScript SDKs in depth",blurb:"Clients, async concurrency, streaming APIs and batch processing in both languages.",topics:[
{t:"Python SDK",b:`${C(`
import anthropic

client = anthropic.Anthropic(
    # api_key defaults to os.environ["ANTHROPIC_API_KEY"]
    max_retries=3,          # default 2
    timeout=60.0,           # seconds
)

msg = client.messages.create(
    model="claude-sonnet-5-5",
    max_tokens=1024,
    system="You are terse.",
    messages=[{"role": "user", "content": "Name three vector databases."}],
)
for block in msg.content:
    if block.type == "text":
        print(block.text)
print(msg.usage.input_tokens, msg.usage.output_tokens)

# per-request overrides
client.with_options(timeout=120.0).messages.create(...)
`,"Python")}<p>Error classes: <code>APIConnectionError</code>, <code>APITimeoutError</code>, <code>APIStatusError</code> and subclasses such as <code>BadRequestError</code> (400), <code>AuthenticationError</code> (401), <code>RateLimitError</code> (429), <code>InternalServerError</code> (5xx).</p>`},
{t:"JavaScript / TypeScript SDK",b:`${C(`
import Anthropic from "@anthropic-ai/sdk";

const client = new Anthropic({ maxRetries: 3, timeout: 60_000 });

try {
  const msg = await client.messages.create({
    model: "claude-sonnet-5-5",
    max_tokens: 1024,
    messages: [{ role: "user", content: "Name three vector databases." }],
  });
  for (const block of msg.content) {
    if (block.type === "text") console.log(block.text);
  }
} catch (err) {
  if (err instanceof Anthropic.RateLimitError) {
    // back off or queue
  } else if (err instanceof Anthropic.APIError) {
    console.error(err.status, err.message);
  } else {
    throw err;
  }
}
`,"TypeScript")}<p>Never call the API with your key directly from browser code; call your own backend instead.</p>`},
{t:"Async requests & concurrency",b:`<p>Use async clients to run many requests concurrently, but cap concurrency to respect rate limits.</p>${C(`
import asyncio
import anthropic

client = anthropic.AsyncAnthropic()
limit = asyncio.Semaphore(5)              # at most 5 in flight

async def summarize(doc: str) -> str:
    async with limit:
        msg = await client.messages.create(
            model="claude-haiku-5-5",
            max_tokens=300,
            messages=[{"role": "user", "content": "Summarize in 2 sentences: " + doc}],
        )
        return next(b.text for b in msg.content if b.type == "text")

async def main(docs):
    return await asyncio.gather(*(summarize(d) for d in docs))

summaries = asyncio.run(main(docs))
`,"Python")}${C(`
const results = await Promise.all(
  docs.map((doc) =>
    client.messages.create({
      model: "claude-haiku-5-5",
      max_tokens: 300,
      messages: [{ role: "user", content: "Summarize in 2 sentences: " + doc }],
    })
  )
); // for large batches, use a concurrency limiter such as p-limit
`,"JavaScript")}<p>Rate limits are measured in requests per minute and input/output tokens per minute, per usage tier. Watch the <code>anthropic-ratelimit-*</code> response headers.</p>`},
{t:"Streaming APIs",b:`<p>Two levels: high-level helpers (text callbacks, final message) and raw events.</p>${C(`
const stream = client.messages.stream({
  model: "claude-sonnet-5-5",
  max_tokens: 1024,
  messages: [{ role: "user", content: "Write a haiku about vectors." }],
});

stream.on("text", (text) => process.stdout.write(text));
const final = await stream.finalMessage();
console.log(final.usage);
`,"JavaScript")}${C(`
# raw events with stream=True
events = client.messages.create(model="claude-sonnet-5-5", max_tokens=1024,
                                messages=messages, stream=True)
for event in events:
    if event.type == "content_block_delta" and event.delta.type == "text_delta":
        print(event.delta.text, end="")
    elif event.type == "message_delta":
        print("stop:", event.delta.stop_reason)
`,"Python")}<p>Event order: <code>message_start</code> → <code>content_block_start</code> → many <code>content_block_delta</code> → <code>content_block_stop</code> → <code>message_delta</code> → <code>message_stop</code> (plus occasional <code>ping</code>, and <code>error</code> events such as overloaded). Tool inputs stream as <code>input_json_delta</code>.</p>`},
{t:"Message Batches API",b:`<p>For large offline jobs (classify 100K tickets, nightly summaries): submit many requests at once, processed asynchronously (most finish well within 24 hours) at about <b>50% lower cost</b>.</p>${C(`
batch = client.messages.batches.create(requests=[
    {"custom_id": f"ticket-{i}",
     "params": {"model": "claude-haiku-5-5", "max_tokens": 50,
                "messages": [{"role": "user", "content": "Label this ticket: " + t}]}}
    for i, t in enumerate(tickets)
])

# later, poll until processing_status == "ended"
status = client.messages.batches.retrieve(batch.id).processing_status
for result in client.messages.batches.results(batch.id):
    print(result.custom_id, result.result.type)
`,"Python")}`}
]},
{id:"s8",step:8,level:"Intermediate",name:"Model Context Protocol (MCP)",blurb:"The open standard for connecting Claude to tools and data: architecture, primitives and building your own server.",topics:[
{t:"MCP fundamentals",b:`<p><b>MCP</b> is an open protocol, introduced by Anthropic in November 2024, that standardizes how AI applications connect to external tools, data and prompts. Think "USB-C port for AI apps".</p><ul><li><b>Problem it solves</b>: without a standard, every app needs custom code for every integration (N apps × M tools). With MCP, build a server once and any MCP client can use it (N + M).</li><li>Adopted widely across AI tools, IDEs and assistants; SDKs in Python, TypeScript, Java, C#, Go and more.</li><li><b>Messages</b> use JSON-RPC 2.0; <b>transports</b> are stdio (local process) and Streamable HTTP (remote, with OAuth for auth).</li></ul>`,tip:"Explain MCP vs function calling: function calling is how a model requests a tool; MCP is a standard for packaging and discovering tools, resources and prompts so they're reusable across apps."},
{t:"MCP architecture (diagram)",b:`${W("flow","mcparch")}<ul><li><b>Host</b>: the AI application the user interacts with (Claude Desktop, Claude Code, an IDE, your app). Manages the model, permissions and user consent.</li><li><b>Client</b>: lives inside the host; one client per server connection (1:1).</li><li><b>Server</b>: a program exposing capabilities from some system (GitHub, a database, files).</li><li><b>Lifecycle</b>: <code>initialize</code> (version + capability negotiation) → operation (list/call/read) → shutdown.</li></ul>`},
{t:"Clients & servers (sequence diagram)",b:`${W("seq","mcp")}<p><b>Client-side capabilities</b> servers can use: <b>sampling</b> (server asks the host's model for a completion), <b>roots</b> (which directories/URIs the server may work in), and <b>elicitation</b> (ask the user for missing input).</p>${C(`
{"jsonrpc": "2.0", "id": 3, "method": "tools/call",
 "params": {"name": "search_issues",
            "arguments": {"label": "payments", "state": "open"}}}
`,"JSON-RPC request")}<p>Common methods: <code>initialize</code>, <code>tools/list</code>, <code>tools/call</code>, <code>resources/list</code>, <code>resources/read</code>, <code>resources/templates/list</code>, <code>prompts/list</code>, <code>prompts/get</code>, plus notifications such as <code>notifications/tools/list_changed</code>.</p>`},
{t:"Resources, tools and prompts",b:`<div class="tbl"><table><tr><th>Primitive</th><th>Controlled by</th><th>What it is</th><th>Example</th></tr>
<tr><td><b>Tools</b></td><td>Model</td><td>Functions Claude can decide to call, with a JSON Schema for inputs; may have side effects</td><td><code>create_issue</code>, <code>run_query</code></td></tr>
<tr><td><b>Resources</b></td><td>Application</td><td>Read-only data identified by URIs that the host chooses to attach as context; can be templated and subscribed to</td><td><code>file:///docs/readme.md</code>, <code>db://customers/42</code></td></tr>
<tr><td><b>Prompts</b></td><td>User</td><td>Reusable prompt templates with arguments, often surfaced as slash commands</td><td><code>/review-pr</code>, <code>/summarize-incident</code></td></tr></table></div><p>Tools can carry <b>annotations</b> (hints such as read-only or destructive) that hosts use to decide when to ask for confirmation.</p>`,tip:"The 'who controls it' column (model / application / user) is the most-asked MCP interview detail."},
{t:"Build and connect an MCP server",b:`${C(`
# pip install "mcp[cli]"
from mcp.server.fastmcp import FastMCP

mcp = FastMCP("notes")
NOTES: dict[str, str] = {}

@mcp.tool()
def add_note(title: str, body: str) -> str:
    """Save a note. Use when the user asks you to remember something."""
    NOTES[title] = body
    return f"Saved note '{title}'"

@mcp.resource("notes://{title}")
def read_note(title: str) -> str:
    """Return the text of a saved note."""
    return NOTES.get(title, "Not found")

@mcp.prompt()
def review_notes() -> str:
    """Review all notes and list open action items."""
    return "Review my notes and list every open action item with an owner."

if __name__ == "__main__":
    mcp.run()          # stdio transport by default
`,"Python")}<p><b>Connect it to Claude Desktop</b> (<code>claude_desktop_config.json</code>):</p>${C(`
{
  "mcpServers": {
    "notes": {
      "command": "python",
      "args": ["/absolute/path/to/notes_server.py"]
    }
  }
}
`,"JSON")}<p><b>Claude Code</b>: <code>claude mcp add notes -- python /path/to/notes_server.py</code>. <b>Debug</b> with the MCP Inspector: <code>npx @modelcontextprotocol/inspector python notes_server.py</code>. The Claude API also offers an MCP connector so a Messages API request can use remote MCP servers directly.</p>
<p><b>Security</b>: only install trusted servers, scope credentials narrowly, review tool descriptions (tool poisoning), require consent for destructive tools, and treat tool output as untrusted (prompt injection).</p>`}
]},
{id:"s9",step:9,level:"Intermediate",name:"RAG with Claude",blurb:"Architecture, embeddings, chunking, vector search and injecting context into Claude prompts.",topics:[
{t:"RAG architecture (interactive pipeline)",b:`<p>RAG retrieves relevant chunks from your knowledge base at query time and injects them into Claude's prompt so answers are grounded and citable.</p><div data-explorer="rag"></div>${W("tree","approach")}${GO("rag","RAG fundamentals")}`},
{t:"Embeddings (interactive 2D demo)",b:`<p>An embedding model maps text to a vector; similar meanings land close together. Tap a word to see its nearest neighbors by cosine similarity.</p>${W("embed")}
<ul><li>Anthropic doesn't offer its own embedding model; its docs point to providers such as <b>Voyage AI</b>. Others: OpenAI, Cohere, Google, or open-source (BGE, E5, sentence-transformers).</li><li>Use the <b>same model</b> for documents and queries; many models want an <code>input_type</code> of query vs document.</li></ul>${C(`
import voyageai

vo = voyageai.Client()                       # reads VOYAGE_API_KEY
doc_vecs = vo.embed(chunks, model="voyage-3.5", input_type="document").embeddings
q_vec = vo.embed([question], model="voyage-3.5", input_type="query").embeddings[0]
`,"Python")}<p class="wnote">Check the provider's docs for current model names.</p>${GO("vec","embeddings & vector DBs")}`},
{t:"Chunking strategies (interactive playground)",b:`<p>Change chunk size, overlap and strategy and watch how the text splits. Highlighted words are repeated overlap.</p>${W("chunk")}<ul><li>Fixed-size (with overlap), recursive, structure-aware (headings), semantic, sentence-window, parent-child.</li><li>Typical start: 256–1024 tokens, 10–20% overlap; tune with evals.</li><li><b>Contextual retrieval</b> (Anthropic): prepend a short Claude-generated context to each chunk before embedding and BM25 indexing; prompt caching keeps it affordable.</li></ul>${GO("chunk","chunking deep dive")}`},
{t:"Vector search",b:`<ol><li>Embed the query.</li><li>Find the top-k nearest chunk vectors by cosine similarity / dot product.</li><li>At scale use ANN indexes (HNSW, IVF) instead of exact search.</li><li>Apply metadata filters (source, date, user permissions).</li><li>Optionally combine with keyword (BM25) search and rerank.</li></ol>${W("rrf")}${GO("retr","retrieval & reranking")}`},
{t:"Context injection (end-to-end code)",b:`<p>Format retrieved chunks as numbered XML documents, instruct Claude to answer only from them, cite, and admit gaps.</p>${C(`
import anthropic, chromadb

claude = anthropic.Anthropic()
db = chromadb.PersistentClient(path="./db")
col = db.get_or_create_collection("handbook")       # uses a default local embedding model

# 1) Index (run once / on updates)
col.add(ids=[c["id"] for c in chunks],
        documents=[c["text"] for c in chunks],
        metadatas=[{"source": c["source"]} for c in chunks])

# 2) Retrieve + 3) Inject + 4) Generate
def answer(question: str) -> str:
    hits = col.query(query_texts=[question], n_results=5)
    docs = "".join(
        f'<document index="{i+1}"><source>{m["source"]}</source>'
        f"<document_content>{d}</document_content></document>"
        for i, (d, m) in enumerate(zip(hits["documents"][0], hits["metadatas"][0]))
    )
    msg = claude.messages.create(
        model="claude-sonnet-5-5",
        max_tokens=800,
        temperature=0.2,
        system=("Answer using only the documents provided. Cite sources like [1]. "
                "If the answer isn't in the documents, say you don't know."),
        messages=[{"role": "user",
                   "content": f"<documents>{docs}</documents>Question: {question}"}],
    )
    return next(b.text for b in msg.content if b.type == "text")
`,"Python")}<ul><li>Documents first, question last.</li><li>Treat retrieved text as untrusted data (it may contain injected instructions).</li><li>Consider Claude's Citations feature for precise source spans.</li><li>Log retrieved chunk IDs with each answer for debugging and evaluation.</li></ul>`}
]},
{id:"s10",step:10,level:"Intermediate",name:"Vector stores: ChromaDB, FAISS, Pinecone",blurb:"Hands-on with the three vector stores you're most likely to be asked about, and how similarity search works.",topics:[
{t:"ChromaDB",b:`<p>Open-source, developer-friendly vector database. Runs in-memory, embedded with on-disk persistence, or as a client/server. Can embed text for you with a default local model.</p>${C(`
import chromadb

client = chromadb.PersistentClient(path="./chroma")
col = client.get_or_create_collection(
    name="docs",
    metadata={"hnsw:space": "cosine"},     # distance metric
)

col.add(
    ids=["c1", "c2"],
    documents=["Refunds are processed within 5 days.", "Shipping is free over $50."],
    metadatas=[{"source": "refunds.md"}, {"source": "shipping.md"}],
)

res = col.query(query_texts=["How long do refunds take?"], n_results=2,
                where={"source": "refunds.md"})
print(res["documents"], res["distances"])
`,"Python")}<p><b>Good for</b>: prototypes, local apps, small-to-medium corpora. Also supports updates, deletes and metadata/document filters.</p>`},
{t:"FAISS",b:`<p>Facebook AI Similarity Search: a high-performance <b>library</b> (not a database) for vector search in memory, with CPU and GPU support.</p>${C(`
import faiss
import numpy as np

vecs = np.array(doc_vecs, dtype="float32")
faiss.normalize_L2(vecs)                       # normalize so inner product = cosine
index = faiss.IndexFlatIP(vecs.shape[1])       # exact search
index.add(vecs)

q = np.array([q_vec], dtype="float32")
faiss.normalize_L2(q)
scores, ids = index.search(q, 5)               # top-5 similarities and row ids

faiss.write_index(index, "docs.faiss")         # persist to disk yourself
`,"Python")}<ul><li>Index types: <code>IndexFlatL2/IP</code> (exact), <code>IndexIVFFlat</code> (clusters; needs <code>train()</code>), <code>IndexIVFPQ</code> (compressed), <code>IndexHNSWFlat</code> (graph).</li><li>You manage IDs → text/metadata mapping, persistence, filtering and updates yourself.</li><li><b>Good for</b>: very fast search, research, custom pipelines, billion-scale with the right index.</li></ul>`},
{t:"Pinecone overview",b:`<p>Fully managed, serverless vector database: no infrastructure to run, scales automatically, with metadata filtering, namespaces for multi-tenancy, and hybrid (sparse + dense) search.</p>${C(`
from pinecone import Pinecone, ServerlessSpec

pc = Pinecone()                                    # reads PINECONE_API_KEY
pc.create_index(name="docs", dimension=1024, metric="cosine",
                spec=ServerlessSpec(cloud="aws", region="us-east-1"))
index = pc.Index("docs")

index.upsert(vectors=[{"id": "c1", "values": vec,
                       "metadata": {"source": "hr.pdf", "year": 2026}}],
             namespace="tenant-a")

res = index.query(vector=q_vec, top_k=5, include_metadata=True,
                  filter={"year": {"$gte": 2025}}, namespace="tenant-a")
`,"Python")}<p><b>Good for</b>: production at scale without ops work. Trade-offs: paid service, data hosted externally, vendor lock-in.</p>`},
{t:"Similarity search & choosing a store",b:`<ul><li><b>Cosine similarity</b>: angle between vectors (1 = same direction). <b>Dot product</b>: equals cosine for normalized vectors. <b>Euclidean (L2)</b>: distance; smaller = closer.</li><li>Chroma returns <i>distances</i> (lower is better); FAISS <code>IndexFlatIP</code> returns <i>similarities</i> (higher is better). Know which you're reading.</li><li><b>Top-k</b> plus an optional similarity threshold so irrelevant results can be dropped.</li></ul>
<div class="tbl"><table><tr><th></th><th>ChromaDB</th><th>FAISS</th><th>Pinecone</th><th>pgvector</th></tr>
<tr><td>Type</td><td>Open-source DB</td><td>Library</td><td>Managed SaaS</td><td>Postgres extension</td></tr>
<tr><td>Setup</td><td>pip install, minutes</td><td>pip install, code around it</td><td>API key, no infra</td><td>Existing Postgres</td></tr>
<tr><td>Metadata filters</td><td>Yes</td><td>No (DIY)</td><td>Yes</td><td>Yes (SQL)</td></tr>
<tr><td>Scale</td><td>Small–medium</td><td>Very large (in memory/GPU)</td><td>Very large</td><td>Medium–large</td></tr>
<tr><td>Best for</td><td>Prototypes, local apps</td><td>Speed, research</td><td>Production without ops</td><td>Teams already on Postgres</td></tr></table></div>`,tip:"A balanced answer: 'Chroma to prototype, FAISS when I need raw speed in-process, Pinecone or pgvector for production depending on scale and whether we want managed infrastructure.'"}
]},
{id:"s11",step:11,level:"Advanced",name:"Memory & AI workflow design",blurb:"Making stateless Claude remember, managing context over long sessions, and choosing the right workflow pattern.",topics:[
{t:"Conversation memory",b:`<p>Because the API is stateless, "memory" is something your app builds.</p><div class="tbl"><table><tr><th>Strategy</th><th>How</th><th>Trade-off</th></tr>
<tr><td>Full buffer</td><td>Resend all turns</td><td>Simple; cost grows every turn</td></tr>
<tr><td>Sliding window</td><td>Keep last N turns</td><td>Cheap; forgets early facts</td></tr>
<tr><td>Summary</td><td>Claude summarizes older turns</td><td>Compact; loses detail</td></tr>
<tr><td>Summary + window</td><td>Summary of old turns + recent turns verbatim</td><td>Common production default</td></tr>
<tr><td>Token-budgeted</td><td>Trim by token count, not turn count</td><td>Predictable cost</td></tr></table></div>${C(`
def build_request(history, summary, user_msg, keep=10):
    recent = history[-keep:]                 # must start with a "user" turn
    system = BASE_SYSTEM
    if summary:
        system += " <conversation_summary>" + summary + "</conversation_summary>"
    return system, recent + [{"role": "user", "content": user_msg}]

def maybe_summarize(history, summary, threshold=30):
    if len(history) < threshold:
        return history, summary
    old, recent = history[:-10], history[-10:]
    msg = client.messages.create(
        model="claude-haiku-5-5", max_tokens=400,
        messages=[{"role": "user", "content":
            "Update this summary with the new turns. Keep names, decisions, preferences. "
            f"<summary>{summary}</summary><turns>{old}</turns>"}])
    return recent, next(b.text for b in msg.content if b.type == "text")
`,"Python")}`},
{t:"Persistent memory (flowchart)",b:`<p>Long-term memory survives across sessions: user preferences, facts, past decisions.</p>${W("flow","memory")}<ul><li><b>Storage</b>: SQL/NoSQL tables (structured facts), vector store (semantic recall of past episodes), or files.</li><li><b>Write policy</b>: extract salient facts with Claude rather than storing everything; timestamp them; resolve contradictions.</li><li><b>Read policy</b>: retrieve by user ID + relevance + recency; inject in a <code>&lt;user_memory&gt;</code> block.</li><li><b>Privacy</b>: consent, user-visible memory, deletion on request, no sensitive data by default.</li><li>Anthropic's API also provides a <b>memory tool</b> (Claude reads and writes files in a memory directory that you host) and <b>context management</b> features such as clearing stale tool results and compaction for long-running agents.</li></ul>${GO("mem","agent memory types")}`},
{t:"Context management for long sessions & agents",b:`<ul><li><b>Compaction</b>: when near the limit, summarize the conversation and continue from the summary.</li><li><b>Clear old tool results</b> that are no longer needed (they're often the biggest token hogs).</li><li><b>Just-in-time retrieval</b>: keep references (file paths, IDs) and load content only when needed.</li><li><b>Sub-agents</b>: give subtasks to fresh contexts that return condensed results.</li><li><b>Structured notes</b>: the agent maintains a progress file or to-do list outside the context.</li><li>Use prompt caching for the stable parts.</li></ul>`},
{t:"AI workflow design",b:`<p>Design process: <b>define the task and success criteria → pick the simplest pattern → design prompts and tools → add guardrails → evaluate → iterate</b>.</p>${W("tree","workflow")}
<p>Why simplicity matters: errors compound over steps. Drag the slider to see how per-step reliability affects multi-step success.</p>${W("compound")}${GO("agent","agent patterns")}`}
]},
{id:"s12",step:12,level:"Advanced",name:"AI security & governance",blurb:"Prompt injection, data leakage, API and secrets security, responsible AI and governance frameworks.",topics:[
{t:"Prompt injection (defense simulator)",b:`<p><b>Direct</b> injection comes from the user; <b>indirect</b> injection hides in content Claude reads (web pages, documents, emails, tool results). Indirect injection is the bigger risk for RAG and agents.</p>${W("inject")}${W("flow","defense")}<p>Remember the <b>lethal trifecta</b>: private data + untrusted content + a way to send data out. Remove at least one leg.</p>${GO("sec","security deep dive")}`},
{t:"Data leakage prevention",b:`<ul><li><b>Minimize data</b>: send only what the task needs; redact PII (names, emails, card numbers) before sending, e.g. with Microsoft Presidio.</li><li><b>No secrets in prompts</b>: system prompts can be extracted.</li><li><b>Permission-aware retrieval</b>: filter by the user's ACLs so Claude never sees documents the user can't.</li><li><b>Output scanning</b> for PII, secrets and internal identifiers.</li><li><b>Block exfiltration channels</b>: no rendering of arbitrary image URLs or links built from user data; egress allow-lists for tools.</li><li><b>Logging hygiene</b>: redact prompts/outputs in logs; restrict access; set retention.</li><li><b>Vendor terms</b>: data retention, training use, zero-data-retention options, regional processing, compliance (SOC 2, ISO 27001, HIPAA where applicable).</li></ul>`},
{t:"API security",b:`${W("flow","proxy")}<ul><li>Never expose your Anthropic key in frontend or mobile code; proxy through your backend.</li><li>Authenticate users (sessions, JWT, OAuth) and authorize per action.</li><li>Rate-limit per user/IP and cap input size and <code>max_tokens</code> to prevent cost abuse ("unbounded consumption").</li><li>Validate and sanitize inputs; never <code>eval</code> or execute model output; escape output before rendering as HTML/SQL.</li><li>HTTPS everywhere; restrictive CORS; security headers.</li><li>Spend limits per workspace in the console; alerts on unusual usage.</li></ul>`},
{t:"Secrets management",b:`<ul><li>Local: <code>.env</code> files (in <code>.gitignore</code>) loaded with dotenv.</li><li>Production: a secrets manager (AWS Secrets Manager, Google Secret Manager, Azure Key Vault, HashiCorp Vault, Doppler), injected as environment variables at runtime; Kubernetes/Docker secrets.</li><li>Never bake secrets into Docker images or commit them; scan repos with tools like gitleaks or trufflehog (pre-commit + CI).</li><li>Separate keys per environment; least privilege; rotate on a schedule and immediately after exposure.</li></ul>${C(`
import os

API_KEY = os.environ["ANTHROPIC_API_KEY"]    # fail fast at startup if missing
`,"Python")}`},
{t:"Responsible AI",b:`<ul><li><b>Fairness</b>: test outputs across demographic groups; avoid using LLMs alone for high-stakes decisions (hiring, credit, medical).</li><li><b>Transparency</b>: tell users they're interacting with AI; show sources; explain limitations.</li><li><b>Human oversight</b>: approval for consequential actions; easy escalation to people.</li><li><b>Safety</b>: content moderation, refusal handling, red teaming before launch.</li><li><b>Privacy</b> and consent for data use.</li><li><b>Accountability</b>: clear owners for each AI feature; incident response.</li><li>Anthropic's approach includes Constitutional AI, a published Usage Policy and a Responsible Scaling Policy with AI Safety Levels (ASL) that set safeguards as capabilities grow.</li></ul>`},
{t:"Governance",b:`<ul><li><b>AI policy</b>: approved use cases, prohibited uses, data rules.</li><li><b>Inventory</b>: which models, prompts, versions and data sources are used where.</li><li><b>Risk assessment</b> per use case before launch; eval sign-off criteria.</li><li><b>Change management</b>: version prompts and models; review changes; rollback plans.</li><li><b>Audit logs</b> of inputs, outputs, tool actions and approvals.</li><li><b>Monitoring</b> of quality, safety incidents and drift.</li><li><b>Frameworks</b>: NIST AI Risk Management Framework (Govern, Map, Measure, Manage), ISO/IEC 42001 (AI management systems), EU AI Act (risk tiers: unacceptable, high, limited, minimal), OWASP Top 10 for LLM apps.</li></ul>`}
]},
{id:"s13",step:13,level:"Advanced",name:"Production app engineering",blurb:"Structuring a Claude application so it's maintainable, observable, fast and affordable.",topics:[
{t:"Modular application design (diagram)",b:`${W("flow","modular")}${C(`
app/
  main.py              # FastAPI app: routes only
  config.py            # settings from env (pydantic-settings)
  schemas.py           # request/response models
  llm/
    client.py          # Claude wrapper: retries, timeouts, logging, fallbacks
    prompts/           # versioned prompt templates
  services/
    chat.py            # orchestration: memory + RAG + agent loop
    rag.py             # retrieval and context building
  tools/               # tool schemas + implementations
  memory/              # conversation + persistent stores
tests/                 # unit tests with a mocked LLM client + eval suite
`,"Project layout")}<p><b>Principles</b>: one place that talks to Claude (easy to swap models, add logging and caching); prompts as versioned files; dependency injection so tests can mock the client; config from the environment; pure business logic separated from I/O.</p>`},
{t:"Error handling & resilience",b:`<ul><li>Timeouts on every call; SDK retries for transient errors.</li><li><b>Fallback models</b> when the primary is overloaded.</li><li><b>Circuit breaker</b>: stop hammering a failing dependency; fail fast for a cooldown.</li><li>Validate outputs; handle <code>max_tokens</code> truncation and refusals.</li><li>Graceful degradation: e.g. return retrieved sources if generation fails.</li><li>User-facing errors that say what happened and what to do.</li></ul>${C(`
import logging, anthropic

log = logging.getLogger("llm")
MODELS = ["claude-sonnet-5-5", "claude-haiku-5-5"]       # primary, fallback

def robust_complete(**kwargs):
    last = None
    for model in MODELS:
        try:
            return client.messages.create(model=model, **kwargs)
        except (anthropic.RateLimitError, anthropic.InternalServerError,
                anthropic.APIConnectionError) as e:
            log.warning("llm_fallback", extra={"model": model, "error": type(e).__name__})
            last = e
    raise RuntimeError("All models unavailable") from last
`,"Python")}`},
{t:"Logging",b:`<p>Use <b>structured (JSON) logs</b> with a correlation ID per request so you can trace a user complaint to the exact prompt, chunks, tool calls and response.</p>${C(`
{"ts": "2026-10-12T09:14:03Z", "level": "info", "event": "llm_call",

`,"JSON log line")}<ul><li>Log: model, prompt version, tokens, latency, stop_reason, tool calls, retrieved IDs, cost, errors with Anthropic <code>request-id</code>.</li><li>Redact PII and never log API keys.</li><li>Send to a log platform; add tracing (OpenTelemetry, Langfuse, LangSmith).</li></ul>`},
{t:"Performance optimization",b:`<ul><li><b>Stream</b> responses (time to first token is what users feel).</li><li><b>Right-size the model</b>: route simple requests to Haiku-class models.</li><li><b>Prompt caching</b> for long stable prefixes.</li><li><b>Parallelize</b> independent retrievals and tool calls; use async clients.</li><li><b>Shorter outputs</b>: tighter <code>max_tokens</code>, ask for concise formats.</li><li><b>Fewer, better chunks</b> via reranking.</li><li><b>Response caching</b> for repeated questions (exact or semantic).</li><li>Tune thinking effort: lower for simple tasks.</li></ul>`},
{t:"Cost optimization (calculator)",b:`${W("cost")}<ul><li>Choose the cheapest model that passes your evals; route by difficulty.</li><li>Prompt caching for repeated context; Batch API (about 50% off) for offline jobs.</li><li>Trim history and retrieved context; summarize.</li><li>Cap <code>max_tokens</code>; ask for concise answers (output tokens cost more).</li><li>Count tokens before sending; track cost per request, user and feature; set workspace spend limits and alerts.</li></ul>`}
]},
{id:"s14",step:14,level:"Advanced",name:"Deployment: FastAPI, Docker & monitoring",blurb:"Serving a Claude app as a REST API, containerizing it, deploying it and watching it in production.",topics:[
{t:"FastAPI",b:`<p>Modern async Python web framework with Pydantic validation and automatic OpenAPI docs (at <code>/docs</code>).</p>${C(`
from fastapi import FastAPI, HTTPException
from fastapi.responses import StreamingResponse
from pydantic import BaseModel, Field
import anthropic

app = FastAPI(title="Claude Assistant API")
client = anthropic.AsyncAnthropic()

class ChatRequest(BaseModel):
    message: str = Field(min_length=1, max_length=4000)

class ChatResponse(BaseModel):
    answer: str
    input_tokens: int
    output_tokens: int

@app.get("/health")
async def health():
    return {"status": "ok"}

@app.post("/v1/chat", response_model=ChatResponse)
async def chat(req: ChatRequest):
    try:
        msg = await client.messages.create(
            model="claude-sonnet-5-5", max_tokens=1024,
            messages=[{"role": "user", "content": req.message}])
    except anthropic.RateLimitError:
        raise HTTPException(status_code=503, detail="Busy, please retry shortly")
    text = "".join(b.text for b in msg.content if b.type == "text")
    return ChatResponse(answer=text, input_tokens=msg.usage.input_tokens,
                        output_tokens=msg.usage.output_tokens)

@app.post("/v1/chat/stream")
async def chat_stream(req: ChatRequest):
    async def events():
        async with client.messages.stream(
            model="claude-sonnet-5-5", max_tokens=1024,
            messages=[{"role": "user", "content": req.message}]) as stream:
            async for text in stream.text_stream:
                yield f"data: {text}\\n\\n"
    return StreamingResponse(events(), media_type="text/event-stream")

# run locally: uvicorn app.main:app --reload
`,"Python")}`},
{t:"Docker basics",b:`<ul><li><b>Image</b>: a packaged, read-only template (code + runtime + dependencies). <b>Container</b>: a running instance of an image.</li><li><b>Dockerfile</b>: build instructions; each instruction adds a cached layer, so copy requirements before code.</li><li><b>Registry</b>: where images live (Docker Hub, ECR, GCR, GHCR).</li><li><b>Volumes</b>: persistent data; <b>networks</b>: container-to-container traffic; <b>compose</b>: run multi-container apps.</li></ul>${C(`
FROM python:3.12-slim
WORKDIR /app
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt
COPY . .
RUN useradd -m appuser
USER appuser
EXPOSE 8000
CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
`,"Dockerfile")}${C(`
docker build -t claude-api .
docker run -p 8000:8000 --env-file .env claude-api    # secrets at runtime, not in the image
docker ps            # running containers
docker logs -f <id>  # follow logs
docker exec -it <id> sh
`,"bash")}${C(`
services:

    build: .
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [chroma]
  chroma:
    image: chromadb/chroma
    ports: ["8001:8000"]
    volumes: ["chroma-data:/data"]
volumes:
  chroma-data:
`,"docker-compose.yml")}<p>Add a <code>.dockerignore</code> (.env, .venv, .git). Use slim base images, a non-root user and pinned dependency versions.</p>`},
{t:"REST API deployment (diagram)",b:`${W("flow","deploy")}<ul><li><b>REST basics</b>: resources + HTTP verbs (GET, POST, PUT/PATCH, DELETE), correct status codes, stateless requests, versioned paths (<code>/v1</code>), JSON bodies.</li><li><b>Serving</b>: uvicorn (or gunicorn with uvicorn workers), multiple replicas behind a load balancer.</li><li><b>Where</b>: Google Cloud Run, AWS ECS/Fargate or App Runner, Azure Container Apps, Render, Railway, or Kubernetes.</li><li><b>CI/CD</b>: on push → lint and test → run evals → build image → push to registry → deploy → smoke test; blue-green or canary releases.</li><li>Health and readiness endpoints; HTTPS; auth; rate limiting; secrets from a manager.</li></ul>`},
{t:"Monitoring concepts",b:`<ul><li><b>Four golden signals</b>: latency, traffic, errors, saturation.</li><li><b>LLM-specific</b>: tokens in/out, cost per request and per day, cache hit rate, time to first token, <code>stop_reason</code> mix (watch <code>max_tokens</code> truncations and refusals), tool error rate, fallback rate, 429/529 counts.</li><li><b>Quality</b>: online evals (LLM-as-judge on samples), thumbs up/down, "I don't know" rate, escalations.</li><li><b>Logs, metrics, traces</b>: Prometheus + Grafana, Datadog, OpenTelemetry, Sentry; LLM observability with Langfuse, LangSmith or Arize Phoenix; Anthropic console usage and cost dashboards.</li><li><b>Alerts</b> on SLO breaches (p95 latency, error rate) and cost spikes; dashboards per feature.</li></ul>`}
]},

{t:"Common gotchas",b:`<ul><li><code>max_tokens</code> is required; output gets cut off silently if it's too low (check <code>stop_reason</code>).</li><li>The API is stateless: you must resend the conversation history.</li><li>Claude's <code>temperature</code> range is 0–1, not 0–2.</li><li>Don't assume <code>content[0]</code> is text; with thinking or tools, filter blocks by type.</li><li>Tool results go in a <b>user</b> message, with matching <code>tool_use_id</code>, and every tool_use needs a result.</li><li>Use the exact model ID string; a typo gives 404.</li><li>Header <code>anthropic-version: 2023-06-01</code> is required for raw HTTP calls.</li><li>Retry 429/5xx/529 with backoff; don't retry 400/401.</li><li>Never put the API key in frontend code or Git.</li><li>Use the same embedding model for indexing and querying.</li><li>Chroma returns distances (lower is better); cosine similarity is higher-is-better.</li><li>MCP: tools are model-controlled, resources app-controlled, prompts user-controlled.</li><li>Prompt caching needs an identical prefix; put changing content last.</li></ul>`}

  el.innerHTML = `<h4>Temperature & top-p playground</h4><p class="wnote">Prompt: "The capital of France is …" These are next-token probabilities. Logit values are illustrative.</p>

  let probs = [];

    let cum = 0; probs = toks.map(([w],i) => { const p = ex[i]/Z; const keep = cum < P; cum += p; return {w,p,keep}; });
    const kz = probs.filter(x=>x.keep).reduce((a,x)=>a+x.p,0); probs.forEach(x => x.f = x.keep ? x.p/kz : 0);

  };
  el.addEventListener("input", draw);
  el.addEventListener("click", e => {
    if(!e.target.closest("[data-sample]")) return;
    const kept = probs.filter(x=>x.keep); const out = [];
    for(let k=0;k<10;k++){ let r=Math.random(), acc=0, pick=kept[kept.length-1].w; for(const x of kept){ acc+=x.f; if(r<=acc){ pick=x.w; break; } } out.push(pick); }

  });

WIDGETS.embed = el => {
  const pts = [["cat",70,40],["kitten",56,54],["dog",86,22],["puppy",94,38],["apple",-62,72],["banana",-82,52],["mango",-46,88],["laptop",-30,-84],["computer",-12,-94],["keyboard",-50,-70],["car",84,-56],["truck",98,-38],["bus",64,-80]];
  const cos = (a,b) => (a[1]*b[1]+a[2]*b[2])/(Math.hypot(a[1],a[2])*Math.hypot(b[1],b[2]));
  el.innerHTML = `<h4>Embedding space (2D illustration)</h4><p class="wnote">Real embeddings have hundreds or thousands of dimensions; this squashes the idea into 2D. Tap a word.</p><div class="svgbox"><svg viewBox="-125 -125 250 250" role="img" aria-label="Words plotted in a 2D embedding space"><line x1="-120" y1="0" x2="120" y2="0" stroke="var(--line)"/><line x1="0" y1="-120" x2="0" y2="120" stroke="var(--line)"/><g class="links"></g>${pts.map((p,i)=>`<g class="pt" data-i="${i}" tabindex="0"><circle cx="${p[1]}" cy="${-p[2]}" r="5" fill="var(--accent)"/><text x="${p[1]+7}" y="${-p[2]+3}" font-size="9">${p[0]}</text></g>`).join("")}</svg></div><div class="wdetail"><p>Tap a word to find its nearest neighbors.</p></div>`;
  const pick = i => {
    const q = pts[i];
    const ranked = pts.map((p,j)=>({p,j,s:cos(q,p)})).filter(x=>x.j!==i).sort((a,b)=>b.s-a.s);
    const top = ranked.slice(0,3);
    el.querySelector(".links").innerHTML = top.map(x=>`<line x1="0" y1="0" x2="${x.p[1]}" y2="${-x.p[2]}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="3 2"/>`).join("") + `<line x1="0" y1="0" x2="${q[1]}" y2="${-q[2]}" stroke="var(--accent)" stroke-width="2"/>`;
    el.querySelectorAll(".pt circle").forEach((c,j)=>c.setAttribute("fill", j===i?"var(--bad)":(top.some(t=>t.j===j)?"var(--good)":"var(--accent)")));
    const far = ranked[ranked.length-1];
    wDetail(el, `<b>Query: "${q[0]}"</b><p>Nearest by cosine similarity: ${top.map(x=>`${x.p[0]} (${x.s.toFixed(2)})`).join(", ")}. Least similar: ${far.p[0]} (${far.s.toFixed(2)}).</p><p>Cosine compares the angle of vectors from the origin, which is why a semantic search for "${q[0]}" returns its cluster.</p>`);
  };
  el.addEventListener("click", e => { const g = e.target.closest(".pt"); if(g) pick(+g.dataset.i); });
  el.addEventListener("keydown", e => { const g = e.target.closest(".pt"); if(g && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); pick(+g.dataset.i); } });
};

WIDGETS.chunk = el => {
  const SAMPLE = "Retrieval-Augmented Generation connects a language model to external knowledge. Documents are split into chunks, embedded, and stored in a vector database. At query time, the question is embedded and the most similar chunks are retrieved. Those chunks are inserted into the prompt so Claude can answer with grounded facts and citations. Chunk size matters: small chunks are precise but may lose context, while large chunks keep context but dilute the embedding. Overlap repeats a few words between neighbouring chunks so ideas that cross a boundary are not lost. Structure-aware chunking follows headings and paragraphs instead of cutting at fixed lengths. Always tune chunking with an evaluation set rather than guessing.";
  const colors = ["#2A55BE","#1F7A4D","#B26A00","#8A3FB0","#B23A3A","#2C8C99"];
  el.innerHTML = `<h4>Chunking playground</h4><div class="form"><label>Strategy<select data-c="mode"><option value="fixed">Fixed size (words) with overlap</option><option value="sent">Sentence-aware packing</option></select></label></div>
  <label class="ctl">Chunk size (words) <output data-o="size"></output><input type="range" min="10" max="80" step="5" value="30" data-c="size"></label>
  <label class="ctl">Overlap <output data-o="ov"></output><input type="range" min="0" max="50" step="5" value="20" data-c="ov"></label>
  <div class="form"><label>Text (edit or paste your own)<textarea rows="4" data-c="text">${escH(SAMPLE)}</textarea></label></div>
  <p class="progline" data-sum></p><div class="chunks"></div>`;
  const draw = () => {
    const mode = el.querySelector("[data-c=mode]").value, size = +el.querySelector("[data-c=size]").value, ov = +el.querySelector("[data-c=ov]").value/100;
    el.querySelector("[data-o=size]").textContent = size; el.querySelector("[data-o=ov]").textContent = Math.round(ov*100)+"%";
    const text = el.querySelector("[data-c=text]").value.trim(); const chunks = [];
    if(mode==="fixed"){
      const words = text.split(/\s+/).filter(Boolean); const olap = Math.round(size*ov); const step = Math.max(1, size-olap);
      for(let i=0;i<words.length;i+=step){ chunks.push({o:i?olap:0, w:words.slice(i,i+size)}); if(i+size>=words.length) break; }
    } else {
      const sents = text.match(/[^.!?]+[.!?]*/g) || [text]; let cur = [], prevLast = null;
      const flush = () => { if(cur.length){ const carry = (ov>=0.2 && prevLast) ? prevLast.trim().split(/\s+/) : []; chunks.push({o:carry.length, w:carry.concat(cur.join(" ").trim().split(/\s+/))}); prevLast = cur[cur.length-1]; cur=[]; } };
      sents.forEach(s => { const n = s.trim().split(/\s+/).length; const curN = cur.join(" ").trim().split(/\s+/).filter(Boolean).length; if(curN && curN+n>size) flush(); cur.push(s); });
      flush();
    }
    el.querySelector("[data-sum]").textContent = `${chunks.length} chunks · ${mode==="sent" ? "sentence-aware (overlap ≥ 20% carries the previous sentence)" : "fixed windows"}`;
    el.querySelector(".chunks").innerHTML = chunks.map((c,i)=>`<div class="chunk" style="--c:${colors[i%colors.length]}"><small>Chunk ${i+1} · ${c.w.length} words${c.o?` · ${c.o} overlapping`:""}</small>${c.o?`<mark>${escH(c.w.slice(0,c.o).join(" "))}</mark> `:""}${escH(c.w.slice(c.o).join(" "))}</div>`).join("");
  };
  el.addEventListener("input", draw); el.addEventListener("change", draw); draw();
};

    const pin=+v("pin").value, pout=+v("pout").value, tin=+v("tin").value, tout=+v("tout").value, rpd=+v("rpd").value, c=Math.min(100,Math.max(0,+v("cache").value))/100;
    const mult = v("batch").checked ? 0.5 : 1;
    const inCost = (tin*(1-c)*pin + tin*c*pin*0.1)/1e6, outCost = tout*pout/1e6;
    const per = (inCost+outCost)*mult, noOpt = (tin*pin/1e6+outCost);
    const fmt = n => "$" + (n<1 ? n.toFixed(4) : n.toLocaleString(undefined,{maximumFractionDigits:2}));
    el.querySelector(".kpis").innerHTML = [["Per request",per],["Per day",per*rpd],["Per month (30 days)",per*rpd*30],["Monthly savings vs no caching/batch",(noOpt-per)*rpd*30]].map(([l,n])=>`<div class="kpi"><b>${fmt(n)}</b><span>${l}</span></div>`).join("");
  };
  el.addEventListener("change", e => { if(e.target.dataset.k==="model"){ const p = presets[e.target.value]; if(p[0]!==null){ v("pin").value=p[0]; v("pout").value=p[1]; } } draw(); });
  el.addEventListener("input", draw); draw();
};

QA.push(
{c:"Claude API",q:"What is Constitutional AI?",a:"Anthropic's training method that uses a written set of principles. Phase 1: the model critiques and revises its own responses against the principles and is fine-tuned on the revisions. Phase 2: an AI compares response pairs using the principles, those labels train a preference model, and RL (RLAIF) optimizes against it. It scales oversight and makes the model's values explicit."},
{c:"Claude API",q:"What are the Claude model tiers and how do you choose?",a:"Haiku (fastest, cheapest), Sonnet (balance of speed and intelligence), Opus (complex agentic and enterprise work) and the Mythos tier such as Fable (highest capability). Choose by task difficulty, latency, cost, context needs and features, then confirm with evals; route easy requests to smaller models."},
{c:"Claude API",q:"Describe the structure of a Messages API request and response.",a:"POST /v1/messages with x-api-key and anthropic-version headers. Body needs model, max_tokens and messages (alternating user/assistant turns), plus optional system, temperature, stop_sequences, stream, tools, tool_choice and output_config. The response has id, role assistant, a list of content blocks (text, thinking, tool_use), stop_reason and usage token counts."},
{c:"Claude API",q:"The Messages API is stateless. How do you build a multi-turn chat?",a:"Store the conversation in your app and resend the full history (or a trimmed/summarized version) with every request, appending Claude's reply and the new user message each turn. Use prompt caching for the stable prefix and summaries to control token growth."},
{c:"Claude API",q:"What stop_reason values can you get and how do you handle them?",a:"end_turn: done. max_tokens: output truncated, so raise the limit or continue. stop_sequence: hit your custom stop string. tool_use: run the requested tools and send tool_result blocks back. pause_turn: a long server-tool turn paused, so send it back to continue. refusal: handle gracefully without blind retries."},
{c:"Claude API",q:"How does streaming work with Claude?",a:"Set stream: true (or use the SDK stream helper) and the API sends server-sent events: message_start, content_block_start, content_block_delta (text_delta or input_json_delta), content_block_stop, message_delta with stop_reason and usage, then message_stop, with possible ping and error events. It reduces perceived latency and avoids timeouts on long outputs."},
{c:"Claude API",q:"How do you handle 429 and 529 errors?",a:"Both are transient: retry with exponential backoff and jitter, honoring retry-after on 429. The SDKs retry automatically (2 times by default). Beyond that: smooth traffic with queues and concurrency limits, cache responses, use a fallback model, and request higher rate limits if 429s persist."},
{c:"Claude API",q:"Walk through Claude tool use step by step.",a:"Send tools (name, description, input_schema) with the messages. If Claude needs one, it returns stop_reason tool_use with tool_use blocks (id, name, input). Your code validates and executes them, then sends a user message with tool_result blocks referencing each tool_use_id (is_error for failures). Repeat until stop_reason is end_turn. tool_choice can be auto, any, a specific tool or none."},
{c:"Claude API",q:"How do you get reliable JSON from Claude?",a:"Use structured outputs: output_config.format with a JSON schema (or SDK helpers with Pydantic/Zod), which uses constrained decoding so output always matches the schema. Use strict: true on tools for guaranteed valid tool inputs. Still validate business rules with Pydantic and retry with the error message if they fail."},
{c:"Prompting",q:"Why does Anthropic recommend XML tags in prompts?",a:"Tags clearly separate instructions, context, examples and data, so Claude doesn't confuse them; they make prompts easier to edit; they let you ask for output in tags that are easy to parse; and labelling untrusted data helps against prompt injection."},
{c:"Prompting",q:"How do you structure a prompt with very long documents?",a:"Put the documents at the top in <document> tags with source metadata, put instructions and the question at the end, and ask Claude to extract relevant quotes first and answer from them. Cache the document prefix if it's reused."},
{c:"Prompting",q:"Zero-shot vs one-shot vs few-shot?",a:"Zero-shot gives only instructions. One-shot adds a single example to show format. Few-shot adds several diverse examples that teach format, tone and edge cases through in-context learning. Wrap examples in <example> tags and make them varied so Claude doesn't copy surface details."},
{c:"Prompting",q:"What is prompt caching and when does it help?",a:"You mark a stable prompt prefix (system prompt, tool definitions, large documents) with cache_control. Subsequent requests sharing that exact prefix read it from cache within its lifetime, cutting latency and input cost significantly. Great for chat over a fixed document, agents with many tools and repeated RAG preambles. Put changing content after the cached part."},
{c:"Prompting",q:"How do you reduce hallucinations with Claude?",a:"Ground answers in provided documents, allow 'I don't know', ask for quotes before answering, require citations (or use the Citations feature) and retract unsupported claims, let Claude think, verify with a second pass or best-of-N comparison, use tools for facts and math, and lower temperature."},
{c:"MCP",q:"Tools vs resources vs prompts in MCP?",a:"Tools are model-controlled functions Claude can call (possibly with side effects). Resources are application-controlled read-only data identified by URIs that the host attaches as context. Prompts are user-controlled reusable templates, often exposed as slash commands."},
{c:"MCP",q:"How do you build and connect an MCP server?",a:"Use an MCP SDK, e.g. Python FastMCP: decorate functions with @mcp.tool(), @mcp.resource(uri) and @mcp.prompt(), then mcp.run() for stdio. Add it to Claude Desktop's claude_desktop_config.json under mcpServers with command and args, or run 'claude mcp add' in Claude Code. Test with the MCP Inspector. Remote servers use Streamable HTTP with OAuth."},
{c:"Vector stores",q:"ChromaDB vs FAISS vs Pinecone?",a:"Chroma is an open-source vector DB that's quick to set up with metadata filters and persistence, ideal for prototypes and small-to-medium apps. FAISS is a fast in-memory similarity search library (CPU/GPU) where you handle storage, metadata and filtering yourself. Pinecone is a fully managed serverless vector DB with filters, namespaces and scale, at a cost and with external hosting."},
{c:"Vector stores",q:"Does Anthropic provide an embedding model?",a:"No. Anthropic's docs point to third-party embedding providers such as Voyage AI. You can also use OpenAI, Cohere, Google or open-source models like BGE or E5, as long as you use the same model for documents and queries."},
{c:"Memory",q:"How do you implement memory for a Claude chatbot?",a:"Short-term: keep conversation history, trimming with a sliding window and summarizing older turns. Long-term: extract key facts and preferences into a database or vector store keyed by user, retrieve relevant ones each request and inject them into the system prompt. Add privacy controls and conflict resolution. Anthropic's memory tool and context-management features can help for agents."},
{c:"Security",q:"How do you keep the Claude API key secure in a web or mobile app?",a:"Never ship it to the client. The client calls your backend, which authenticates users, rate-limits, validates input and calls Claude with a key loaded from environment variables or a secrets manager. Use separate keys per environment, workspace spend limits, rotation and secret scanning in CI."},
{c:"Security",q:"How do you prevent data leakage in an LLM app?",a:"Minimize and redact sensitive data before sending, keep secrets out of prompts, filter retrieval by user permissions, scan outputs for PII and secrets, block exfiltration channels such as arbitrary links or images, redact logs, and review vendor data-retention terms."},
{c:"Deployment",q:"How would you deploy a Claude app with FastAPI and Docker?",a:"Build FastAPI endpoints with Pydantic validation, an async Claude client, streaming via server-sent events and a /health route. Containerize with a slim Python image, non-root user and secrets passed at runtime (--env-file or a secrets manager). Run several stateless replicas behind an HTTPS load balancer on Cloud Run, ECS or Kubernetes, with CI/CD running tests and evals before deploy."},
{c:"Deployment",q:"What do you monitor for a Claude application?",a:"Golden signals (latency including time to first token, traffic, errors, saturation) plus LLM metrics: tokens, cost, cache hit rate, stop_reason mix (truncations, refusals), tool errors, 429/529 counts and fallback rate, and quality via online evals and user feedback. Use structured logs with request IDs, traces and alerts."},
{c:"Deployment",q:"How do you cut Claude API costs?",a:"Route to the smallest model that passes evals, use prompt caching for repeated context, the Batch API for offline jobs, trim history and retrieved chunks, cap max_tokens and request concise outputs, cache frequent answers, count tokens before sending, and track cost per feature with spend alerts."},
{c:"Claude API",q:"How do you run many Claude requests concurrently?",a:"Use AsyncAnthropic with asyncio.gather (or Promise.all in JS), capped by a semaphore or concurrency limiter so you stay under rate limits. Let the SDK retry transient errors, watch the rate-limit headers, and use the Batch API for large offline workloads."}
);
